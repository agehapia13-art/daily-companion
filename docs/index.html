              '<div style="display:flex;gap:8px;justify-content:center;">' +
                '<button type="button" class="btn-soft" onclick="toggleReflectTimeAdjust(false)">キャンセル</button>' +
                '<button type="button" class="btn-solid" onclick="applyReflectTimeAdjust()">適用</button>' +
              '</div>' +
            '</div></div>';
        center.innerHTML =
          '<div class="reflect-view fade-in">' +
            '<h2 class="reflect-heading">' + (r.card.isSleepCard ? 'おはようございます' : 'お疲れさまでした') + '</h2>' +
            '<div class="reflect-sub">' + escapeHtml(r.card.title) + (r.card.isSleepCard ? '' : ' · ' + r.usedMins + '分') + '</div>' +
            reflectAdjustHtml +
            '<div class="feeling-row">' + chips + '</div>' +
            photoHtml +
            '<div class="reflect-input-row">' +
              '<input id="reflectPhotoInput" type="file" accept="image/*" class="hidden" onchange="handleReflectPhotoSelect(event)" />' +
              '<button type="button" onclick="document.getElementById(\'reflectPhotoInput\').click()" class="attach-btn-glass" aria-label="写真を添付">' + getIconSvg('camera', 18) + '</button>' +
              '<input id="reflectNoteInput" type="text" class="reflect-input" placeholder="ひとこと感想（書かなくてもOK）" value="' + escapeHtml(r.note || '') + '" oninput="if(state.reflection) state.reflection.note=this.value;" />' +
            '</div>' +
            (r.card && (r.card.linkedType === 'task' || r.card.linkedType === 'stock')
              ? '<div style="display:flex;flex-direction:column;gap:8px;width:100%;">' +
                  '<button type="button" id="reflectKeepOpenBtn" onclick="completeReflection(true)" class="btn-next-full" style="background:rgba(255,255,255,0.45);color:var(--text-primary);border:1px solid rgba(255,255,255,0.6);"' + (state.isSubmittingReflect ? ' disabled' : '') + '>' + (state.isSubmittingReflect ? '記録中…' : '今日はここまで（未完のまま記録）') + '</button>' +
                  '<button type="button" id="reflectNextBtn" onclick="completeReflection(false)" class="btn-next-full"' + (state.isSubmittingReflect ? ' disabled' : '') + '>' + (state.isSubmittingReflect ? '記録中…' : '完了にする（やり切った）') + '</button>' +
                '</div>'
              : '<button type="button" id="reflectNextBtn" onclick="completeReflection(false)" class="btn-next-full"' + (state.isSubmittingReflect ? ' disabled' : '') + '>' + (state.isSubmittingReflect ? '記録中…' : 'つぎへ') + '</button>') +
          '</div>';
        return;
      }

      if (sess) {
        var elSec = Math.max(0, Math.floor((Date.now() - (sess.startedAtMs || Date.now()) - (sess.pausedDurationMs || 0)) / 1000));
        var showBreak = Math.floor(elSec / 60) >= 60 && !sess.isWorkBlock && !sess.isSleepCard;
        var sValActive = formatTimeInputHm_(sess.startedAtMs || Date.now());
        var activeAdjustHtml = !state.isStartAdjustOpen
          ? '<div class="time-adjust-wrap"><button type="button" class="time-adjust-toggle" onclick="toggleStartTimeAdjust(true)">✎ 開始時刻を調整（' + sValActive + '〜）</button></div>'
          : '<div class="time-adjust-wrap"><div class="glass-surface time-adjust-panel fade-in">' +
              '<div style="display:flex;align-items:center;justify-content:center;gap:8px;">' +
                '<span style="font-size:12px;color:var(--dc-text-sub);">開始時刻</span>' +
                '<input id="activeStartTimeInput" type="time" class="time-adjust-input" value="' + sValActive + '" />' +
              '</div>' +
              '<div style="display:flex;gap:8px;justify-content:center;">' +
                '<button type="button" class="btn-soft" onclick="toggleStartTimeAdjust(false)">キャンセル</button>' +
                '<button type="button" class="btn-solid" onclick="applyStartTimeAdjust()">適用</button>' +
              '</div>' +
            '</div></div>';
        center.innerHTML =
          '<div class="focus-view fade-in">' +
            '<h2 class="focus-title">' + escapeHtml(sess.title) + '</h2>' +
            '<div class="focus-dial">' +
              '<div class="focus-dial-inner">' +
                '<span class="focus-kicker">' + getIconSvg(sess.icon || 'compass', 13) + ' ' + (sess.isSleepCard ? 'おやすみ中' : '進行中') + '</span>' +
                '<div id="focusTimerText" class="focus-timer">' + formatTimer(elSec) + '</div>' +
              '</div>' +
            '</div>' +
            '<div id="focusGentleNote" class="focus-gentle-note' + (showBreak ? '' : ' hidden') + '">そろそろ一息入れませんか</div>' +
            '<div class="focus-actions">' +
              '<button onclick="pauseFocus()" class="btn-pause-soft">キャンセル</button>' +
              (!sess.isSleepCard && !state.fastState.pausedSession ? '<button type="button" onclick="pauseActiveToHold()" class="btn-pause-soft">一時停止</button>' : '') +
              '<button onclick="finishFocus()" class="btn-done-pill">' + (sess.isSleepCard ? '起きた' : '終わった') + '</button>' +
            '</div>' +
            activeAdjustHtml +
          '</div>';
        return;
      }

      var cards = getVisibleDeckCards();
      var parts = [];
      if (state.fastState.pausedSession) {
        var ps = state.fastState.pausedSession;
        var pElSec = Math.max(0, Math.floor(((ps.pausedAtMs || Date.now()) - (ps.startedAtMs || Date.now()) - (ps.pausedDurationMs || 0)) / 1000));
        var pMin = Math.floor(pElSec / 60);
        var pSec = pElSec % 60;
        var pLabel = pMin + '分' + (pSec < 10 ? '0' : '') + pSec + '秒';
        parts.push(
          '<div class="glass-surface paused-session-bar fade-in">' +
            '<div class="paused-session-info">' +
              '<span class="paused-session-badge">⏸ 中断中</span>' +
              '<span class="paused-session-title">' + escapeHtml(ps.title || '') + ' (' + pLabel + ')</span>' +
            '</div>' +
            '<div class="paused-session-actions">' +
              '<button type="button" class="btn-solid paused-session-btn" onclick="resumePausedSession()">再開</button>' +
              '<button type="button" class="btn-soft paused-session-btn" onclick="completePausedSession()">完了</button>' +
              '<button type="button" class="btn-soft paused-session-btn" onclick="discardPausedSession()" aria-label="破棄">×</button>' +
            '</div>' +
          '</div>'
        );
      }
      parts.push('<div class="cards-stack fade-in">');
      if (state.isRefreshingDeck) {
        parts.push(
          '<div class="action-card" style="cursor:default;">' +
            '<div class="card-icon-badge">' + getIconSvg('refresh', 18) + '</div>' +
            '<div class="card-body">' +
              '<div class="card-row1"><span class="card-title">新しい候補を探しています…</span></div>' +
              '<div class="card-row2">反映まで少しお待ちください</div>' +
            '</div>' +
          '</div>'
        );
      } else if (cards.length === 0) {
        parts.push(
          '<div class="action-card" style="cursor:default;">' +
            '<div class="card-icon-badge">' + getIconSvg('checkCircle', 18) + '</div>' +
            '<div class="card-body">' +
              '<div class="card-row1"><span class="card-title">今の手札は落ち着いています</span></div>' +
              '<div class="card-row2">「別の候補」か「自分で始める」から選べます</div>' +
            '</div>' +
          '</div>'
        );
      } else {
        cards.forEach(function(c) {
          var cls = c.isTriage ? 'action-card triage' : 'action-card';
          var rightHtml = c.isTriage
            ? '<span class="card-right triage-badge">' + escapeHtml(c.rightLabel || '引き算') + ' ' + getIconSvg('chevron', 14) + '</span>'
            : '<span class="card-right">' +
                (c.isSleepCard ? '' : '<button type="button" onclick="event.stopPropagation();openCardDurAdjust(\'' + escapeJsAttr(c.id) + '\')" style="background:rgba(139,92,246,0.12);border:none;border-radius:999px;color:inherit;font:inherit;font-weight:600;padding:6px 10px;margin:-4px 2px -4px 0;cursor:pointer;" title="開始前に所要時間を調整">' + formatCustomDurLabel(c.mins) + '</button> ') +
                getIconSvg('chevron', 14) +
              '</span>';
          parts.push(
            '<div class="swipe-wrap" data-card-id="' + escapeHtml(c.id) + '">' +
              '<div class="swipe-behind">' +
                '<button type="button" onclick="dismissCardToday(\'' + escapeJsAttr(c.id) + '\')" class="swipe-dismiss-btn">' +
                  getIconSvg('eyeOff', 16) +
                  '<span>今日は提案しない</span>' +
                '</button>' +
              '</div>' +
              '<div class="' + cls + '" role="button" tabindex="0">' +
                '<div class="card-icon-badge">' + getIconSvg(c.icon || 'compass', 18) + '</div>' +
                '<div class="card-body">' +
                  '<div class="card-row1"><span class="card-title">' + escapeHtml(c.title) + '</span>' + rightHtml + '</div>' +
                  '<div class="card-row2">' + escapeHtml(c.sub || '') + '</div>' +
                '</div>' +
              '</div>' +
            '</div>'
          );
        });
      }
      parts.push('</div>');

      parts.push(
        '<div class="subtle-actions">' +
          '<button onclick="toggleCustomForm()" class="text-link primary-link">' + getIconSvg('plus', 13) + ' 自分で始める</button>' +
          '<button onclick="rotateDeck()" class="text-link">' + getIconSvg('shuffle', 13) + ' 別の候補</button>' +
          '<button onclick="toggleLowMode()" class="text-link">' + getIconSvg('cloud', 13) + ' ' + (state.fastState.isLowMode ? '通常に戻す' : '少しだるい') + '</button>' +
        '</div>'
      );

      if (state.adjustingCardId) {
        var adjCard = findDeckCardById(state.adjustingCardId);
        if (adjCard) {
          parts.push(
            '<div class="custom-create-card glass-surface fade-in">' +
              '<div style="font-size:13px;font-weight:600;color:var(--text-primary);">「' + escapeHtml(adjCard.title) + '」の見込み時間を調整</div>' +
              renderDurSliderHtml('adjustDurSlider', 'adjustDurDisplay', 'setAdjustDurStep', state.adjustingCardMins || adjCard.mins || 30) +
              '<div class="custom-btns">' +
                '<button type="button" onclick="confirmCardDurStart()" class="btn-solid">この時間で始める</button>' +
                '<button type="button" onclick="cancelCardDurAdjust()" class="btn-ghost">キャンセル</button>' +
              '</div>' +
            '</div>'
          );
        }
      }

      if (state.showCustomForm) {
        parts.push(
          '<form onsubmit="startCustomCard(event)" class="custom-create-card glass-surface fade-in">' +
            '<input id="customTitleInput" type="text" class="custom-input" placeholder="これから始めること（例：ギター練習）" />' +
            renderDurSliderHtml('customDurSlider', 'customDurDisplay', 'setCustomDurStep', state.customDurMins) +
            '<div class="custom-btns">' +
              '<button type="button" onclick="toggleCustomForm(false)" class="btn-soft">閉じる</button>' +
              '<button type="submit" class="btn-solid">始める</button>' +
            '</div>' +
          '</form>'
        );
      }

      center.innerHTML = parts.join('');
      bindSwipeHandlers();
    }

    function dismissBriefing() {
      if (state.fastState.dailyBriefing) {
        state.fastState.dailyBriefing.dismissed = true;
        state.fastState.dismissedToday['__briefing__'] = true;
        saveLocalSnapshot();
        renderHome();
        runMutationApi('apiDismissCardToday', state.authKey, '__briefing__').catch(function() {});
      }
    }

    function rotateDeck() {
      if (state.isRefreshingDeck) return;
      var completed = state.fastState.completedToday || {};
      var dismissed = state.fastState.dismissedToday || {};
      var activeTaskIds = getActiveTaskIdSet();
      var rawCards = state.fastState.isLowMode ? (state.composedDeck.lowCards || []) : (state.composedDeck.cards || []);
      var pool = rawCards.filter(function(c) {
        return isDeckCardAvailable(c, completed, dismissed, activeTaskIds);
      });
      var nextOffset = state.deckOffset + 3;
      if (nextOffset < pool.length) {
        state.deckOffset = nextOffset;
        state.openSwipeId = null;
        renderHome();
        return;
      }
      state.deckOffset = 0;
      state.isRefreshingDeck = true;
      renderHome();
      var excludeIds = pool.map(function(c) { return c.id; });
      runMutationApi('apiRefreshDeck', state.authKey, excludeIds)
        .then(function(res) {
          state.isRefreshingDeck = false;
          if (res && res.authorized && !res._stale) {
            state.fastState.aiDeck = res.aiDeck;
            state.composedDeck = res.deck;
            saveLocalSnapshot();
          }
          renderHome();
        })
        .catch(function() {
          state.isRefreshingDeck = false;
          showToast('候補の更新に失敗しました');
          renderHome();
        });
    }

    function toggleLowMode() {
      state.openSwipeId = null;
      state.fastState.isLowMode = !state.fastState.isLowMode;
      saveLocalSnapshot();
      renderHome();
    }

    function dismissCardToday(cardId) {
      var targetCard = findDeckCardById(cardId);
      var cardTitle = (targetCard && targetCard.title) ? String(targetCard.title).trim() : '';
      state.fastState.dismissedToday[cardId] = cardTitle || true;
      state.openSwipeId = null;
      saveLocalSnapshot();
      renderHome();
      showToast('今日は非表示にしました');
      runMutationApi('apiDismissCardToday', state.authKey, cardId, cardTitle)
        .then(function(res) {
          if (res && res.authorized && !res._stale && res.deck) {
            applyServerStatePayload(res);
            saveLocalSnapshot();
          }
        })
        .catch(function() {});
    }

    function toggleCustomForm(force) {
      state.showCustomForm = (typeof force === 'boolean') ? force : !state.showCustomForm;
      renderHome();
      if (state.showCustomForm) {
        var inp = document.getElementById('customTitleInput');
        if (inp) inp.focus();
      }
    }

    function startCustomCard(ev) {
      ev.preventDefault();
      var inp = document.getElementById('customTitleInput');
      var title = inp ? inp.value.trim() : '';
      if (!title) return;
      state.showCustomForm = false;
      startAction({
        id: 'custom_' + Date.now(),
        icon: 'compass',
        title: title,
        sub: '自分で始めた行動',
        mins: state.customDurMins,
        isCustom: true
      });
    }

    function openCardDurAdjust(cardId) {
      var card = findDeckCardById(cardId);
      if (!card) return;
      state.showCustomForm = false;
      state.adjustingCardId = cardId;
      state.adjustingCardMins = card.mins || 30;
      renderHome();
    }

    function setAdjustDurStep(stepIdx) {
      var idx = Math.max(0, Math.min(CUSTOM_DUR_STEPS.length - 1, Number(stepIdx) || 0));
      state.adjustingCardMins = CUSTOM_DUR_STEPS[idx];
      var disp = document.getElementById('adjustDurDisplay');
      if (disp) disp.textContent = formatCustomDurLabel(state.adjustingCardMins);
    }

    function cancelCardDurAdjust() {
      state.adjustingCardId = null;
      renderHome();
    }

    function confirmCardDurStart() {
      var card = findDeckCardById(state.adjustingCardId);
      state.adjustingCardId = null;
      if (!card) { renderHome(); return; }
      var updated = Object.assign({}, card, { mins: state.adjustingCardMins || card.mins || 30 });
      startAction(updated);
    }

    function handleCardClick(cardId) {
      var cards = getVisibleDeckCards();
      var card = cards.find(function(c) { return c.id === cardId; });
      if (!card) return;
      if (card.isTriage) {
        executeTriageCard(card);
        return;
      }
      state.pendingSessionLockUntil = Date.now() + 8000;
      startAction(card);
    }

    function executeTriageCard(card) {
      state.fastState.triagedToday = true;
      state.fastState.completedToday[card.id] = true;
      saveLocalSnapshot();
      renderHome();
      showToast('今日の残り負荷を軽くしました');
      enqueueOutboxMutation('apiCompleteAction', { session: card });
    }

    function startAction(card) {
      var started = Object.assign({}, card, { startedAtMs: Date.now() });
      state.fastState.activeSession = started;
      if (state.fastState.dailyBriefing) state.fastState.dailyBriefing.dismissed = true;
      state.openSwipeId = null;
      state.reflection = null;
      saveLocalSnapshot();
      renderHome();

      enqueueOutboxMutation('apiStartAction', started);
    }

    function pauseFocus() {
      state.pendingSessionLockUntil = Date.now() + 8000;
      state.fastState.activeSession = null;
      saveLocalSnapshot();
      renderHome();
      enqueueOutboxMutation('apiStartAction', null);
    }

    function pauseActiveToHold() {
      var sess = state.fastState && state.fastState.activeSession;
      if (!sess || sess.isSleepCard || state.fastState.pausedSession) return;
      state.pendingSessionLockUntil = Date.now() + 8000;
      var held = Object.assign({}, sess, { pausedAtMs: Date.now() });
      state.fastState.pausedSession = held;
      state.fastState.activeSession = null;
      saveLocalSnapshot();
      renderHome();
      enqueueOutboxMutation('apiPausedSession', { pausedSession: held, activeSession: null });
    }

    function resumePausedSession() {
      var ps = state.fastState && state.fastState.pausedSession;
      if (!ps) return;
      state.pendingSessionLockUntil = Date.now() + 8000;
      var nowMs = Date.now();
      var addedPause = Math.max(0, nowMs - (ps.pausedAtMs || nowMs));
      var resumed = Object.assign({}, ps, {
        pausedDurationMs: (ps.pausedDurationMs || 0) + addedPause
      });
      delete resumed.pausedAtMs;
      state.fastState.pausedSession = null;
      state.fastState.activeSession = resumed;
      saveLocalSnapshot();
      renderHome();
      enqueueOutboxMutation('apiPausedSession', { pausedSession: null, activeSession: resumed });
    }

    function completePausedSession() {
      var ps = state.fastState && state.fastState.pausedSession;
      if (!ps) return;
      state.pendingSessionLockUntil = Date.now() + 8000;
      var endMs = ps.pausedAtMs || Date.now();
      var startMs = ps.startedAtMs || endMs;
      var elMins = Math.max(1, Math.round((endMs - startMs - (ps.pausedDurationMs || 0)) / 60000));
      state.fastState.pausedSession = null;
      state.reflection = {
        card: ps,
        startedMs: startMs,
        endedMs: endMs,
        usedMins: elMins,
        feeling: '',
        note: '',
        photoDataUrl: '',
        photoBase64: '',
        photoMimeType: 'image/jpeg'
      };
      saveLocalSnapshot();
      renderHome();
      enqueueOutboxMutation('apiPausedSession', { pausedSession: null });
    }

    function discardPausedSession() {
      if (!state.fastState || !state.fastState.pausedSession) return;
      state.pendingSessionLockUntil = Date.now() + 8000;
      state.fastState.pausedSession = null;
      saveLocalSnapshot();
      renderHome();
      enqueueOutboxMutation('apiPausedSession', { pausedSession: null });
    }

    function formatTimeInputHm_(ms) {
      var d = new Date(ms || Date.now());
      return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
    }

    function applyTimeInputToMs_(baseMs, timeStr) {
      var parts = String(timeStr || '').split(':');
      if (parts.length !== 2) return baseMs || Date.now();
      var d = new Date(baseMs || Date.now());
      d.setHours(Number(parts[0]), Number(parts[1]), 0, 0);
      if (d.getTime() > Date.now() + 60000) {
        d.setDate(d.getDate() - 1);
      }
      return d.getTime();
    }

    function toggleStartTimeAdjust(open) {
      state.isStartAdjustOpen = Boolean(open);
      renderHome();
    }

    function applyStartTimeAdjust() {
      var el = document.getElementById('activeStartTimeInput');
      var sess = state.fastState && state.fastState.activeSession;
      if (!el || !el.value || !sess) return;
      var newMs = applyTimeInputToMs_(sess.startedAtMs || Date.now(), el.value);
      sess.startedAtMs = newMs;
      sess.startedAtIso = new Date(newMs).toISOString();
      state.isStartAdjustOpen = false;
      saveLocalSnapshot();
      renderHome();
      enqueueOutboxMutation('apiStartAction', sess);
      showToast('開始時刻を ' + el.value + ' に更新しました');
    }

    function toggleReflectTimeAdjust(open) {
      if (!state.reflection) return;
      state.reflection.isAdjustOpen = Boolean(open);
      renderHome();
    }

    function applyReflectTimeAdjust() {
      var r = state.reflection;
      if (!r) return;
      var sEl = document.getElementById('reflectStartTimeInput');
      var eEl = document.getElementById('reflectEndTimeInput');
      if (sEl && sEl.value) {
        r.startedMs = applyTimeInputToMs_(r.startedMs, sEl.value);
        if (r.card) r.card.startedAtMs = r.startedMs;
      }
      if (eEl && eEl.value) r.endedMs = applyTimeInputToMs_(r.endedMs, eEl.value);
      r.usedMins = Math.max(1, Math.round((r.endedMs - r.startedMs) / 60000));
      r.isAdjustOpen = false;
      renderHome();
      showToast('実績時間を ' + r.usedMins + '分 に更新しました');
    }

    function finishFocus() {
      var sess = state.fastState.activeSession;
      if (!sess) return;
      var endMs = Date.now();
      var startMs = sess.startedAtMs || endMs;
      var elMins = Math.max(1, Math.round((endMs - startMs - (sess.pausedDurationMs || 0)) / 60000));
      state.isStartAdjustOpen = false;
      state.fastState.activeSession = null;
      state.reflection = {
        card: sess,
        startedMs: startMs,
        endedMs: endMs,
        usedMins: elMins,
        feeling: '',
        note: '',
        photoDataUrl: '',
        photoBase64: '',
        photoMimeType: 'image/jpeg'
      };
      renderHome();
    }

    function toggleFeeling(chip) {
      if (!state.reflection) return;
      state.reflection.feeling = state.reflection.feeling === chip ? '' : chip;
      renderHome();
    }

    function completeReflection(keepOpen) {
      if (!state.reflection || state.isSubmittingReflect) return;
      var r = state.reflection;
      var noteEl = document.getElementById('reflectNoteInput');
      var note = noteEl ? noteEl.value.trim() : (r.note || '').trim();

      // 楽観的UI: 即座にふりかえり画面を閉じてHomeへ戻り、裏でサーバーへ記録する
      state.pendingSessionLockUntil = Date.now() + 15000;
      state.reflection = null;
      state.fastState.activeSession = null;
      if (r.card && r.card.id && !r.card.isCustom && !r.card.isSleepCard) {
        state.fastState.completedToday[r.card.id] = true;
      }
      if (!keepOpen && r.card && r.card.linkedType === 'task' && r.card.linkedId) {
        state.fastState.completedToday[r.card.linkedId] = true;
      }
      saveLocalSnapshot();
      renderAll();
      showToast(keepOpen ? 'ここまでの進行を記録しました' : (r.feeling || note || r.photoBase64 ? '記録して次へ進みました' : 'お疲れさまでした'));

      enqueueOutboxMutation('apiCompleteAction', {
        session: r.card,
        mood: r.feeling,
        note: note,
        keepOpen: Boolean(keepOpen),
        startedAtMs: r.startedMs,
        endedAtMs: r.endedMs,
        usedMins: r.usedMins,
        photoBase64: r.photoBase64 || '',
        photoMimeType: r.photoMimeType || 'image/jpeg'
      });
    }

    function handleReflectPhotoSelect(ev) {
      var file = ev.target && ev.target.files && ev.target.files[0];
      if (!file || !state.reflection) return;
      compressImageToJpeg(file).then(function(res) {
        if (!state.reflection) return;
        state.reflection.photoDataUrl = res.dataUrl;
        state.reflection.photoBase64 = res.base64;
        state.reflection.photoMimeType = res.mimeType;
        renderHome();
      }).catch(function() { showToast('画像を読み込めませんでした'); });
      ev.target.value = '';
    }

    function bindSwipeHandlers() {
      var wraps = document.querySelectorAll('.swipe-wrap');
      wraps.forEach(function(wrap) {
        var cardId = wrap.getAttribute('data-card-id');
        var front = wrap.querySelector('.action-card');
        if (!front || !cardId) return;
        var startX = 0;
        var startY = 0;
        var baseOffset = (state.openSwipeId === cardId) ? -118 : 0;
        var currentOffset = baseOffset;
        var isTracking = false;
        var isHorizontal = null;

        if (state.openSwipeId === cardId) {
          wrap.classList.add('swipe-open');
          front.style.transform = 'translateX(-118px)';
        } else {
          wrap.classList.remove('swipe-open');
        }

        front.addEventListener('pointerdown', function(e) {
          if (e.button && e.button !== 0) return;
          startX = e.clientX;
          startY = e.clientY;
          baseOffset = (state.openSwipeId === cardId) ? -118 : 0;
          currentOffset = baseOffset;
          isTracking = true;
          isHorizontal = null;
          front.style.transition = 'none';
          try { front.setPointerCapture(e.pointerId); } catch (err) {}
        });

        front.addEventListener('pointermove', function(e) {
          if (!isTracking) return;
          var dx = e.clientX - startX;
          var dy = e.clientY - startY;
          if (isHorizontal === null) {
            if (Math.abs(dx) > 8 || Math.abs(dy) > 8) {
              isHorizontal = Math.abs(dx) > Math.abs(dy);
              if (!isHorizontal) {
                isTracking = false;
                wrap.classList.remove('swiping');
                front.style.transition = '';
                return;
              }
            } else {
              return;
            }
          }
          currentOffset = Math.max(-148, Math.min(0, baseOffset + dx));
          wrap.classList.toggle('swiping', currentOffset < -4);
          front.style.transform = 'translateX(' + currentOffset + 'px)';
        });

        function finishPointer(e, canceled) {
          if (!isTracking) return;
          isTracking = false;
          try { front.releasePointerCapture(e.pointerId); } catch (err) {}
          wrap.classList.remove('swiping');
          front.style.transition = '';

          if (!canceled && isHorizontal !== true) {
            if (state.openSwipeId) {
              state.openSwipeId = null;
              renderHome();
              return;
            }
            if (e.target && e.target.closest && e.target.closest('button')) return;
            handleCardClick(cardId);
            return;
          }
          if (!canceled && currentOffset <= -108) {
            wrap.classList.add('swipe-open');
            front.style.transform = 'translateX(-100%)';
            setTimeout(function() { dismissCardToday(cardId); }, 140);
            return;
          }
          if (!canceled && currentOffset <= -44) {
            state.openSwipeId = cardId;
            wrap.classList.add('swipe-open');
            front.style.transform = 'translateX(-118px)';
          } else {
            if (state.openSwipeId === cardId) state.openSwipeId = null;
            wrap.classList.remove('swipe-open');
            front.style.transform = 'translateX(0px)';
          }
        }
        front.addEventListener('pointerup', function(e) { finishPointer(e, false); });
        front.addEventListener('pointercancel', function(e) { finishPointer(e, true); });
      });
    }

    function renderChat() {
      var list = document.getElementById('chatList');
      if (!list) return;
      if (state.messages.length === 0 && !state.isSending) {
        list.innerHTML = '<div class="chat-empty">今日の会話はまだありません</div>';
        return;
      }

      var html = state.messages.map(function(m) {
        if (m.isError) {
          return (
            '<div class="bubble-wrap ai fade-in">' +
              '<div class="error-card">' +
                '<div class="error-title">送信できませんでした</div>' +
                '<div>' + escapeHtml(m.errorText || '通信またはAIエラーが発生しました。') + '</div>' +
                '<div class="error-actions">' +
                  '<button onclick="retryFailedMessage(\'' + escapeJsAttr(m.id) + '\')" class="btn-solid">再試行</button>' +
                  '<button onclick="restoreFailedMessage(\'' + escapeJsAttr(m.id) + '\')" class="btn-soft">入力に戻す</button>' +
                '</div>' +
              '</div>' +
            '</div>'
          );
        }

        var parts = [];
        var userImgs = (Array.isArray(m.imageUrls) && m.imageUrls.length > 0) ? m.imageUrls : (m.localPhotoUrl ? [m.localPhotoUrl] : []);
        if (m.userText || userImgs.length > 0) {
          var imgHtml = userImgs.map(function(u) {
            return '<img src="' + escapeHtml(u) + '" class="bubble-photo" alt="画像" onclick="openImageLightbox(\'' + escapeJsAttr(u) + '\')" />';
          }).join('');
          var uTextHtml = '';
          if (Array.isArray(m.tokens) && m.tokens.length > 0) {
            uTextHtml = m.tokens.map(function(tk) {
              return tk.type === 'pill'
                ? '<span class="inline-var-pill" data-kind="' + escapeHtml(tk.kind) + '">' + escapeHtml(tk.label) + '</span>'
                : linkifyEscapedText(tk.value);
            }).join('');
          } else if (m.userText) {
            uTextHtml = linkifyEscapedText(m.userText);
          }
          var reactHtml = m.reactionEmoji ? '<span class="reaction-chip">' + escapeHtml(m.reactionEmoji) + '</span>' : '';
          parts.push(
            '<div class="bubble-wrap user fade-in">' +
              '<div class="bubble">' + imgHtml + (uTextHtml ? '<div>' + uTextHtml + '</div>' : '') + '</div>' +
              reactHtml +
              (m.time ? '<div class="bubble-time">' + escapeHtml(m.time) + '</div>' : '') +
            '</div>'
          );
        }

        if (m.aiText || (m.badges && m.badges.length > 0) || (m.docLinks && m.docLinks.length > 0)) {
          var badgesHtml = (m.badges && m.badges.length > 0)
            ? '<div class="quiet-badges-row">' + m.badges.map(function(b) {
                return '<span class="quiet-badge">' + escapeHtml(b) + '</span>';
              }).join('') + '</div>'
            : '';
          var docsHtml = (m.docLinks && m.docLinks.length > 0)
            ? '<div class="doc-links-row">' + m.docLinks.map(function(dl) {
                return '<a href="' + escapeHtml(dl.url) + '" target="_blank" rel="noopener noreferrer" class="doc-link-btn"><span>📄 ' + escapeHtml(dl.label) + '</span><span>↗</span></a>';
              }).join('') + '</div>'
            : '';
          parts.push(
            '<div class="bubble-wrap ai fade-in">' +
              '<div class="bubble">' +
                (m.aiText ? '<div>' + linkifyEscapedText(m.aiText) + '</div>' : '') +
                badgesHtml +
                docsHtml +
              '</div>' +
              (m.time ? '<div class="bubble-time">' + escapeHtml(m.time) + '</div>' : '') +
            '</div>'
          );
        }
        return parts.join('');
      }).join('');

      if (state.isSending) {
        var statusHtml = state.sendingStatusText
          ? '<span class="thinking-status" style="margin-left:8px;font-size:12px;color:var(--text-sub,#64748b);">' + escapeHtml(state.sendingStatusText) + '</span>'
          : '';
        html += '<div class="bubble-wrap ai fade-in"><div class="thinking-row" style="display:inline-flex;align-items:center;"><div class="thinking-bubble"><span class="thinking-dot"></span><span class="thinking-dot"></span><span class="thinking-dot"></span></div>' + statusHtml + '</div></div>';
      }
      list.innerHTML = html;
    }

    function scrollToChatBottom() {
      var sc = document.getElementById('talkScroll');
      if (sc) setTimeout(function() { sc.scrollTop = sc.scrollHeight; }, 30);
    }

    function insertPillToSharedComposer(kind, itemId, label) {
      var editor = document.getElementById('talkEditor');
      if (!editor) return;
      var pill = document.createElement('span');
      pill.className = 'inline-var-pill';
      pill.setAttribute('contenteditable', 'false');
      pill.setAttribute('data-kind', kind);
      pill.setAttribute('data-id', itemId);
      pill.setAttribute('data-label', label);
      var txtSpan = document.createElement('span');
      txtSpan.textContent = label;
      var rm = document.createElement('span');
      rm.className = 'pill-remove';
      rm.textContent = '×';
      rm.onclick = function(e) { e.stopPropagation(); pill.remove(); };
      pill.appendChild(txtSpan);
      pill.appendChild(rm);
      editor.appendChild(pill);
      editor.appendChild(document.createTextNode(' '));

      setTimeout(function() {
        editor.focus();
        var range = document.createRange();
        range.selectNodeContents(editor);
        range.collapse(false);
        var sel = window.getSelection();
        sel.removeAllRanges();
        sel.addRange(range);
      }, 15);
    }

    function submitTalkEditor() {
      var editor = document.getElementById('talkEditor');
      if (!editor || state.isSending) return;

      var tokens = [];
      function collectEditorNodes(parentNode) {
        parentNode.childNodes.forEach(function(node) {
          if (node.nodeType === Node.TEXT_NODE) {
            tokens.push({ type: 'text', value: node.textContent });
          } else if (node.nodeType === Node.ELEMENT_NODE) {
            if (node.classList.contains('inline-var-pill')) {
              tokens.push({
                type: 'pill',
                kind: node.getAttribute('data-kind') || 'tasks',
                id: node.getAttribute('data-id') || '',
                label: node.getAttribute('data-label') || ''
              });
            } else if (node.tagName === 'BR') {
              tokens.push({ type: 'text', value: '\n' });
            } else {
              var isBlock = node.tagName === 'DIV' || node.tagName === 'P';
              if (isBlock && tokens.length > 0) {
                tokens.push({ type: 'text', value: '\n' });
              }
              collectEditorNodes(node);
            }
          }
        });
      }
      collectEditorNodes(editor);

      var plainText = tokens.map(function(t) {
        if (t.type !== 'pill') return t.value;
        return (t.kind === 'tasks' && t.id) ? ('「' + t.label + '」(ID:' + t.id + ')') : ('「' + t.label + '」');
      }).join('').trim();
      var photo = state.pendingChatPhoto;
      if (!plainText && !photo) return;

      editor.innerHTML = '';
      state.pendingChatPhoto = null;
      renderChatPhotoPreview();

      var now = new Date();
      var nowTime = ('0' + now.getHours()).slice(-2) + ':' + ('0' + now.getMinutes()).slice(-2);
      var msgObj = {
        id: 'MSG_' + Date.now(),
        time: nowTime,
        userText: plainText,
        tokens: tokens,
        localPhotoUrl: photo ? photo.dataUrl : '',
        imageUrls: [],
        reactionEmoji: '',
        aiText: '',
        badges: [],
        docLinks: []
      };
      executeChatSend(msgObj, plainText, photo);
    }

    function finalizeChatResponse(msgObj, res, fallbackAiText) {
      msgObj.reactionEmoji = res.reactionEmoji || '';
      msgObj.aiText = res.replyText || res.aiText || fallbackAiText || '';
      msgObj.badges = Array.isArray(res.badges) ? res.badges : [];
      msgObj.docLinks = Array.isArray(res.docLinks) ? res.docLinks : [];
      msgObj.time = res.time || msgObj.time || '';
      if (Array.isArray(res.imageUrls) && res.imageUrls.length > 0) {
        msgObj.imageUrls = res.imageUrls;
      } else if (res.imageUrl) {
        msgObj.imageUrls = [res.imageUrl];
      }
      applyServerStatePayload(res, { preferServerLowMode: true });
      saveLocalSnapshot();
      renderAll();
      scrollToChatBottom();
      if (res.needsDeckRefresh) {
        runMutationApi('apiRefreshDeck', state.authKey, [])
          .then(function(deckRes) {
            if (deckRes && deckRes.authorized && deckRes.deck) {
              state.composedDeck = deckRes.deck;
              if (deckRes.aiDeck && state.fastState) state.fastState.aiDeck = deckRes.aiDeck;
              saveLocalSnapshot();
              if (state.tab === 'home') renderHome();
            }
          })
          .catch(function() {});
      }
    }

    function appendChatErrorCard(msgObj, plainText, photo, err) {
      var errId = 'ERR_' + Date.now();
      state.failedPayloads[errId] = { msgObj: msgObj, plainText: plainText, photo: photo };
      state.messages.push({
        id: errId,
        isError: true,
        errorText: (err && err.message) ? err.message : String(err || '通信エラー')
      });
      renderChat();
      scrollToChatBottom();
    }

    function executeChatSend(msgObj, plainText, photo) {
      if (state.messages.indexOf(msgObj) === -1) state.messages.push(msgObj);
      state.isSending = true;
      state.sendingStatusText = '';
      if (state.tab === 'lists') state.tab = 'talk';
      renderNav();
      renderChat();
      scrollToChatBottom();

      var chatPayload = {
        text: plainText,
        imageBase64: photo ? photo.base64 : '',
        imageMimeType: photo ? photo.mimeType : ''
      };

      if (typeof isWorkersApiUrl === 'function' && isWorkersApiUrl()) {
        var tempId = Date.now() + '_' + Math.random().toString(36).slice(2, 6);
        var streamMsgId = 'STREAM_' + tempId;
        var streamMsgObj = null;
        var accumulatedText = '';
        var settled = false;

        state.syncEpoch = (state.syncEpoch || 0) + 1;
        state.inFlightMutations = (state.inFlightMutations || 0) + 1;

        function finishInFlight() {
          if (settled) return;
          settled = true;
          state.inFlightMutations = Math.max(0, (state.inFlightMutations || 1) - 1);
        }

        function removeStreamDraft() {
          if (!streamMsgObj) return;
          state.messages = state.messages.filter(function(m) { return m.id !== streamMsgId; });
          streamMsgObj = null;
        }

        sendChatStream(chatPayload, {
          onStatus: function(data) {
            if (data && typeof data === 'object' && data.resetDraft) {
              accumulatedText = '';
              removeStreamDraft();
              state.isSending = true;
            }
            var statusText = '';
            if (typeof data === 'string') {
              statusText = data;
            } else if (data && typeof data === 'object') {
              statusText = String(data.text || data.status || data.message || '');
            }
            state.sendingStatusText = statusText;
            if (state.isSending) {
              renderChat();
              scrollToChatBottom();
            }
          },
          onDelta: function(data) {
            var chunk = '';
            if (typeof data === 'string') {
              chunk = data;
            } else if (data && typeof data === 'object') {
              chunk = String(data.text || data.delta || data.chunk || '');
            }
            if (!chunk) return;
            accumulatedText += chunk;
            if (!streamMsgObj) {
              streamMsgObj = {
                id: streamMsgId,
                time: '',
                userText: '',
                aiText: accumulatedText,
                badges: [],
                docLinks: []
              };
              state.messages.push(streamMsgObj);
            } else {
              streamMsgObj.aiText = accumulatedText;
            }
            state.isSending = false;
            state.sendingStatusText = '';
            renderChat();
            scrollToChatBottom();
          },
          onDone: function(data) {
            finishInFlight();
            state.isSending = false;
            state.sendingStatusText = '';
            removeStreamDraft();
            if (!data || data.authorized === false) {
              appendChatErrorCard(msgObj, plainText, photo, new Error((data && data.error) ? data.error : '認証エラー'));
              return;
            }
            finalizeChatResponse(msgObj, data, accumulatedText);
          },
          onError: function(err) {
            finishInFlight();
            state.isSending = false;
            state.sendingStatusText = '';
            removeStreamDraft();
            appendChatErrorCard(msgObj, plainText, photo, err);
          }
        });
        return;
      }

      runMutationApi('apiSendChat', state.authKey, chatPayload)
        .then(function(res) {
          state.isSending = false;
          state.sendingStatusText = '';
          if (!res || !res.authorized) {
            throw new Error((res && res.error) ? res.error : '認証エラー');
          }
          finalizeChatResponse(msgObj, res, '');
        })
        .catch(function(err) {
          setTimeout(function() {
            callServerApi('apiGetHomeBootstrap', state.authKey)
              .then(function(boot) {
                if (boot && boot.authorized && Array.isArray(boot.chatMessages)) {
                  var matched = null;
                  for (var i = boot.chatMessages.length - 1; i >= 0; i--) {
                    var cm = boot.chatMessages[i];
                    if (cm && cm.userText && plainText && cm.userText.indexOf(plainText.slice(0, 20)) !== -1 && (cm.aiText || cm.reactionEmoji)) {
                      matched = cm;
                      break;
                    }
                  }
                  if (matched) {
                    state.isSending = false;
                    state.sendingStatusText = '';
                    applyServerStatePayload(boot);
                    var localErrors = state.messages.filter(function(m) { return m.isError; });
                    state.messages = boot.chatMessages.concat(localErrors);
                    saveLocalSnapshot();
                    renderAll();
                    scrollToChatBottom();
                    return;
                  }
                }
                throw err;
              })
              .catch(function() {
                state.isSending = false;
                state.sendingStatusText = '';
                appendChatErrorCard(msgObj, plainText, photo, err);
              });
          }, 1500);
        });
    }

    function retryFailedMessage(errId) {
      if (state.isSending) return;
      var saved = state.failedPayloads[errId];
      if (!saved) return;
      delete state.failedPayloads[errId];
      state.messages = state.messages.filter(function(m) { return m.id !== errId; });
      executeChatSend(saved.msgObj, saved.plainText, saved.photo);
    }

    function restoreFailedMessage(errId) {
      var saved = state.failedPayloads[errId];
      if (!saved) return;
      delete state.failedPayloads[errId];
      state.messages = state.messages.filter(function(m) { return m.id !== errId && m.id !== saved.msgObj.id; });
      var editor = document.getElementById('talkEditor');
      if (editor) editor.textContent = saved.plainText;
      if (saved.photo) {
        state.pendingChatPhoto = saved.photo;
        renderChatPhotoPreview();
      }
      renderChat();
    }

    function renderLists() {
      ['tasks', 'shopping', 'stock', 'habits'].forEach(function(k) {
        var btn = document.getElementById('seg-' + k);
        if (btn) btn.classList.toggle('active', state.listSubTab === k);

              var docBtn = t.docUrl
                ? '<a href="' + escapeHtml(t.docUrl) + '" target="_blank" rel="noopener noreferrer" onclick="event.stopPropagation()" class="circle-action-btn" aria-label="資料を開く" title="資料を開く" style="text-decoration:none;">' + getIconSvg('fileText', 14) + '</a>'
                : '';
              var playBtn = t.done
                ? ''
                : '<button type="button" onclick="event.stopPropagation();startFromList(\'task\',\'' + escapeJsAttr(t.id) + '\')" class="circle-action-btn" aria-label="今すぐ始める">' + getIconSvg('play', 14) + '</button>';
              return (
                '<div class="list-item ' + (t.done ? 'done' : '') + '" onclick="insertPillToSharedComposer(\'tasks\',\'' + escapeJsAttr(t.id) + '\',\'' + escapeJsAttr(t.cleanTitle || t.title) + '\')">' +
                  '<div class="list-item-main">' +
                    '<div class="list-item-title">' + escapeHtml(t.title) + '</div>' +
                    '<div class="list-item-meta">' + escapeHtml(metaParts.join(' · ') || t.cat) + '</div>' +
                  '</div>' +
                  '<div style="display:flex;align-items:center;gap:6px;flex-shrink:0;">' + durBtn + memoBtn + docBtn + playBtn + '</div>' +
                '</div>' +
                renderListMemoCard('task', t.id, t.cleanTitle || t.title, t.memo) +
                renderListDurAdjustCard('task', t.id, t.cleanTitle || t.title)
              );
            }).join('');
        return;
      }

      catRow.classList.add('hidden');

      if (state.listSubTab === 'shopping') {
        var shops = state.lists.shopping || [];
        container.innerHTML = shops.length === 0
          ? '<div class="chat-empty">買い物リストは空です</div>'
          : shops.map(function(s) {
              return (
                '<div class="list-item ' + (s.done ? 'done' : '') + '" onclick="insertPillToSharedComposer(\'shopping\',\'' + escapeJsAttr(s.id) + '\',\'' + escapeJsAttr(s.item) + '\')">' +
                  '<div class="list-item-main">' +
                    '<div class="list-item-title">' + escapeHtml(s.item) + '</div>' +
                    '<div class="list-item-meta">' + escapeHtml(s.category || s.cat || '日用品') + (s.done ? ' · 購入済' : '') + '</div>' +
                  '</div>' +
                  '<button type="button" onclick="event.stopPropagation();toggleShoppingDone(\'' + escapeJsAttr(s.id) + '\')" class="circle-action-btn" aria-label="購入済を切替">' + getIconSvg('check', 15) + '</button>' +
                '</div>'
              );
            }).join('');
        return;
      }

      if (state.listSubTab === 'stock') {
        var stocks = state.lists.stock || [];
        container.innerHTML = stocks.length === 0
          ? '<div class="chat-empty">インプットストックはありません</div>'
          : stocks.map(function(st) {
              var estMins = Number(st.estimatedMins || st.mins) || 30;
              var durBtn = st.done
                ? ''
                : '<button type="button" onclick="event.stopPropagation();openListDurAdjust(\'stock\',\'' + escapeJsAttr(st.id) + '\',' + estMins + ')" class="cat-chip" style="padding:4px 8px;font-size:11px;" title="所要時間を調整して開始">' + formatCustomDurLabel(estMins) + '</button>';
              var memoBtn = buildListMemoBtnHtml('stock', st.id, st.memo);
              var playBtn = st.done
                ? ''
                : '<button type="button" onclick="event.stopPropagation();startFromList(\'stock\',\'' + escapeJsAttr(st.id) + '\')" class="circle-action-btn" aria-label="今すぐ始める">' + getIconSvg('play', 14) + '</button>';
              return (
                '<div class="list-item ' + (st.done ? 'done' : '') + '" onclick="insertPillToSharedComposer(\'stock\',\'' + escapeJsAttr(st.id) + '\',\'' + escapeJsAttr(st.title) + '\')">' +
                  '<div class="list-item-main">' +
                    '<div class="list-item-title">[' + escapeHtml(st.type) + '] ' + escapeHtml(st.title) + '</div>' +
                    '<div class="list-item-meta">' + (st.done ? '消化済' : estMins + '分') + '</div>' +
                  '</div>' +
                  '<div style="display:flex;align-items:center;gap:6px;flex-shrink:0;">' + durBtn + memoBtn + playBtn + '</div>' +
                '</div>' +
                renderListMemoCard('stock', st.id, st.title, st.memo) +
                renderListDurAdjustCard('stock', st.id, st.title)
              );
            }).join('');
        return;
      }

      var habits = state.lists.habits || [];
      container.innerHTML = habits.length === 0
        ? '<div class="chat-empty">周期・習慣記録はありません</div>'
        : habits.map(function(h) {
              var habitTitle = h.label || h.title || '';
              var estMins = Number(h.estimatedMins || h.mins) || 20;
              var durBtn = '<button type="button" onclick="event.stopPropagation();openListDurAdjust(\'habits\',\'' + escapeJsAttr(h.id) + '\',' + estMins + ')" class="cat-chip" style="padding:4px 8px;font-size:11px;" title="所要時間を調整して開始">' + formatCustomDurLabel(estMins) + '</button>';
              return (
              '<div class="list-item" onclick="insertPillToSharedComposer(\'habits\',\'' + escapeJsAttr(h.id) + '\',\'' + escapeJsAttr(habitTitle) + '\')">' +
                '<div class="list-item-main">' +
                  '<div class="list-item-title">' + escapeHtml(habitTitle) + '</div>' +
                  '<div class="list-item-meta">' + escapeHtml(h.elapsed || '') + ' · ' + estMins + '分</div>' +
                '</div>' +
                '<div style="display:flex;align-items:center;gap:6px;flex-shrink:0;">' + durBtn +
                '<button type="button" onclick="event.stopPropagation();startFromList(\'habits\',\'' + escapeJsAttr(h.id) + '\')" class="circle-action-btn" aria-label="今すぐ始める">' + getIconSvg('play', 14) + '</button></div>' +
              '</div>' +
              renderListDurAdjustCard('habits', h.id, habitTitle)
            );
          }).join('');
    }

    function getListMemoCardId(kind, itemId) {
      return 'list-memo-card-' + kind + '-' + String(itemId).replace(/[^a-zA-Z0-9_-]/g, '_');
    }

    function buildListMemoBtnHtml(kind, itemId, memo) {
      if (!memo || !String(memo).trim()) return '';
      var k = escapeJsAttr(kind);
      var id = escapeJsAttr(itemId);
      return '<button type="button"' +
        ' onclick="event.stopPropagation()"' +
        ' onpointerdown="event.stopPropagation();event.preventDefault();showListMemoPeek(\'' + k + '\',\'' + id + '\',this)"' +
        ' onpointerup="event.stopPropagation();hideListMemoPeek(\'' + k + '\',\'' + id + '\',this)"' +
        ' onpointercancel="event.stopPropagation();hideListMemoPeek(\'' + k + '\',\'' + id + '\',this)"' +
        ' onpointerleave="hideListMemoPeek(\'' + k + '\',\'' + id + '\',this)"' +
        ' oncontextmenu="event.preventDefault();event.stopPropagation()"' +
        ' onblur="hideListMemoPeek(\'' + k + '\',\'' + id + '\',this)"' +
        ' class="circle-action-btn" aria-label="長押しでメモを確認" title="押している間メモを表示"' +
        ' style="touch-action:none;user-select:none;-webkit-user-select:none;">' +
        getIconSvg('message', 14) + '</button>';
    }

    function showListMemoPeek(kind, itemId, btn) {
      var card = document.getElementById(getListMemoCardId(kind, itemId));
      if (card) card.style.display = 'block';
      if (btn) {
        btn.style.borderColor = 'var(--accent)';
        btn.style.color = 'var(--accent)';
      }
    }

    function hideListMemoPeek(kind, itemId, btn) {
      var card = document.getElementById(getListMemoCardId(kind, itemId));
      if (card) card.style.display = 'none';
      if (btn) {
        btn.style.borderColor = '';
        btn.style.color = '';
      }
    }

    function renderListMemoCard(kind, itemId, title, memo) {
      if (!memo || !String(memo).trim()) return '';
      return (
        '<div id="' + escapeHtml(getListMemoCardId(kind, itemId)) + '" class="custom-create-card glass-surface fade-in" style="margin:6px 0 10px;display:none;" onclick="event.stopPropagation()">' +
          '<div style="font-size:12px;font-weight:600;color:var(--text-secondary);margin-bottom:6px;">メモ · ' + escapeHtml(title) + '</div>' +
          '<div style="font-size:13px;line-height:1.55;color:var(--text-primary);white-space:pre-wrap;word-break:break-word;">' + escapeHtml(String(memo).trim()) + '</div>' +
        '</div>'
      );
    }

    function renderListDurAdjustCard(kind, itemId, title) {
      if (!state.adjustingListItem || state.adjustingListItem.kind !== kind || state.adjustingListItem.id !== itemId) return '';
      return (
        '<div class="custom-create-card glass-surface fade-in" style="margin:6px 0 10px;">' +
          '<div style="font-size:13px;font-weight:600;color:var(--text-primary);">「' + escapeHtml(title) + '」の見込み時間を調整</div>' +
          renderDurSliderHtml('listDurSlider', 'listDurDisplay', 'setListDurStep', state.adjustingListMins || 30) +
          '<div class="custom-btns">' +
            '<button type="button" onclick="confirmListDurStart()" class="btn-solid">この時間で始める</button>' +
            '<button type="button" onclick="cancelListDurAdjust()" class="btn-ghost">キャンセル</button>' +
          '</div>' +
        '</div>'
      );
    }

    function openListDurAdjust(kind, itemId, currentMins) {
      if (state.adjustingListItem && state.adjustingListItem.kind === kind && state.adjustingListItem.id === itemId) {
        state.adjustingListItem = null;
      } else {
        state.adjustingListItem = { kind: kind, id: itemId };
        state.adjustingListMins = currentMins || 30;
      }
      renderLists();
    }

    function setListDurStep(stepIdx) {
      var idx = Math.max(0, Math.min(CUSTOM_DUR_STEPS.length - 1, Number(stepIdx) || 0));
      state.adjustingListMins = CUSTOM_DUR_STEPS[idx];
      var disp = document.getElementById('listDurDisplay');
      if (disp) disp.textContent = formatCustomDurLabel(state.adjustingListMins);
    }

    function cancelListDurAdjust() {
      state.adjustingListItem = null;
      renderLists();
    }

    function confirmListDurStart() {
      var item = state.adjustingListItem;
      state.adjustingListItem = null;
      if (!item) { renderLists(); return; }
      startFromList(item.kind, item.id, state.adjustingListMins);
    }

    function startFromList(kind, itemId, overrideMins) {
      var card = null;
      if (kind === 'task') {
        var t = (state.lists.tasks || []).find(function(x) { return x.id === itemId; });
        if (!t) return;
        card = { id: t.id, linkedType: 'task', linkedId: t.id, icon: 'checkCircle', title: t.cleanTitle || t.title, sub: t.memo || 'タスク', mins: overrideMins || Number(t.estimatedMins || t.mins) || 30 };
      } else if (kind === 'stock') {
        var st = (state.lists.stock || []).find(function(x) { return x.id === itemId; });
        if (!st) return;
        card = { id: st.id, linkedType: 'stock', linkedId: st.title, icon: st.type === '音楽' ? 'music' : 'book', title: st.title, sub: st.type, mins: overrideMins || Number(st.estimatedMins || st.mins) || 30 };
      } else if (kind === 'habits') {
        var h = (state.lists.habits || []).find(function(x) { return x.id === itemId; });
        if (!h) return;
        var habitTitle = h.label || h.title || '';
        card = { id: h.id, linkedType: 'habit', linkedId: habitTitle, cycleStampLabel: habitTitle, icon: 'wind', title: habitTitle, sub: h.elapsed || '習慣ケア', mins: overrideMins || Number(h.estimatedMins || h.mins) || 20 };
      }
      if (!card) return;
      state.pendingSessionLockUntil = Date.now() + 8000;
      switchTab('home');
      startAction(card);
    }

    function toggleShoppingDone(itemId) {
      var s = (state.lists.shopping || []).find(function(x) { return x.id === itemId; });
      if (!s) return;
      s.done = !s.done;
      saveLocalSnapshot();
      renderLists();
      showToast(s.done ? '「' + s.item + '」を購入済にしました' : '「' + s.item + '」を未買に戻しました');
      runMutationApi('apiMutateListItem', state.authKey, {
        listType: 'shopping',
        action: 'toggle',
        rowIndex: s.rowIndex,
        done: s.done
      }).then(function(res) {
        if (res && res.authorized && !res._stale && res.lists) {
          state.lists = res.lists;
          saveLocalSnapshot();
        }
      }).catch(function() {});
    }

    function openSettingsModal(errMsg) {
      var modal = document.getElementById('settingsModal');
      var errEl = document.getElementById('settingsError');
      document.getElementById('apiUrlFieldGroup').classList.toggle('hidden', isGasEnvironment());
      document.getElementById('inputApiUrl').value = state.apiUrl || '';
      document.getElementById('inputAuthKey').value = state.authKey || '';
      var importBtn = document.getElementById('importSheetsBtn');
      if (importBtn) {
        var showImport = typeof isWorkersApiUrl === 'function' && isWorkersApiUrl();
        var importWrap = importBtn.parentElement || importBtn;
        importWrap.classList.toggle('hidden', !showImport);
      }
      if (errMsg) {
        errEl.textContent = errMsg;
        errEl.classList.remove('hidden');
      } else {
        errEl.classList.add('hidden');
      }
      renderSettingsDiagnostics();
      modal.classList.remove('hidden');
    }

    function renderSettingsDiagnostics() {
      var countEl = document.getElementById('errorLogCount');
      var previewEl = document.getElementById('settingsErrorLogPreview');
      var discardBtn = document.getElementById('discardOutboxBtn');
      var logs = (state && Array.isArray(state.errorLogs)) ? state.errorLogs : [];
      if (countEl) countEl.textContent = String(logs.length);
      if (previewEl) {
        if (logs.length === 0 && !state.outboxLastError) {
          previewEl.textContent = 'エラーログはありません';
        } else {
          previewEl.textContent = buildDiagnosticReportText();
        }
      }
      if (discardBtn) {
        var pendingCount = (state && state.pendingOutbox) ? state.pendingOutbox.length : 0;
        discardBtn.classList.toggle('hidden', pendingCount === 0);
        if (pendingCount > 0) {
          discardBtn.textContent = '未同期(' + pendingCount + '件)を破棄';
        }
      }
    }

    function copyDiagnosticLogs() {
      var text = buildDiagnosticReportText();
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text)
          .then(function() { showToast('診断ログをコピーしました'); })
          .catch(function() { fallbackCopyText_(text); });
      } else {
        fallbackCopyText_(text);
      }
    }

    function runImportFromSheets() {
      if (!confirm('スプレッドシートの最新データを D1 データベースへ取り込みますか？')) return;
      var btn = document.getElementById('importSheetsBtn');
      if (btn) btn.disabled = true;
      importFromSheets()
        .then(function(res) {
          if (btn) btn.disabled = false;
          if (res && res.error) {
            showToast('取り込みに失敗しました: ' + res.error);
            return;
          }
          showToast('シートからデータを取り込みました');
          syncFromServer(true);
        })
        .catch(function(err) {
          if (btn) btn.disabled = false;
          showToast('取り込みに失敗しました: ' + (err && err.message ? err.message : String(err || '不明なエラー')));
        });
    }

    function fallbackCopyText_(text) {
      try {
        var ta = document.createElement('textarea');
        ta.value = text;
        ta.style.position = 'fixed';
        ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        document.body.removeChild(ta);
        showToast('診断ログをコピーしました');
      } catch (e) {
        showToast('コピーに失敗しました');
      }
    }

    function clearDiagnosticLogs() {
      if (typeof clearErrorLogs === 'function') clearErrorLogs();
      state.outboxLastError = '';
      renderSettingsDiagnostics();
      showToast('エラーログをクリアしました');
    }

    function confirmDiscardOutbox() {
      var cnt = (state && state.pendingOutbox) ? state.pendingOutbox.length : 0;
      if (cnt === 0) return;
      if (confirm('未同期の記録 ' + cnt + '件 を破棄してサーバーと再同期しますか？')) {
        closeSettingsModal();
        if (typeof discardPendingOutbox === 'function') discardPendingOutbox();
      }
    }

    function closeSettingsModal() {
      document.getElementById('settingsModal').classList.add('hidden');
    }

    function saveSettings() {
      var apiVal = (document.getElementById('inputApiUrl').value || '').trim();
      var keyVal = (document.getElementById('inputAuthKey').value || '').trim();
      state.apiUrl = apiVal;
      state.authKey = keyVal;
      try {
        localStorage.setItem('companion_api_url', apiVal);
        localStorage.setItem('companion_auth_key', keyVal);
      } catch (e) {}
      closeSettingsModal();
      syncFromServer(true);
    }

    function openImageLightbox(src) {
      if (!src) return;
      document.getElementById('lightboxImg').src = src;
      document.getElementById('imageLightbox').classList.remove('hidden');
    }

    function closeImageLightbox() {
      document.getElementById('imageLightbox').classList.add('hidden');
    }

    function renderAll() {
      renderNav();
      renderHome();
      if (state.tab === 'talk') renderChat();
      if (state.tab === 'lists') renderLists();
    }

    function showToast(msg) {
      var el = document.getElementById('toastBar');
      if (!el) return;
      el.textContent = msg;
      el.classList.remove('hidden');
      if (state.toastTimer) clearTimeout(state.toastTimer);
      state.toastTimer = setTimeout(function() { el.classList.add('hidden'); }, 2200);
    }

    function escapeHtml(s) {
      return String(s || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function linkifyEscapedText(rawStr) {
      var escaped = escapeHtml(rawStr);
      return escaped.replace(/(https?:\/\/[^\s<>"']+)/g, function(url) {
        return '<a href="' + url + '" target="_blank" rel="noopener noreferrer" class="dc-url-text">' + url + '</a>';
      });
    }

    function escapeJsAttr(s) {
      return String(s || '')
        .replace(/\\/g, '\\\\')
        .replace(/'/g, "\\'")
        .replace(/"/g, '&quot;')
        .replace(/\n/g, '\\n')
        .replace(/\r/g, '');
    }

    function bindComposerListeners() {
      var editor = document.getElementById('talkEditor');
      if (!editor) return;
      editor.addEventListener('keydown', function(e) {
        if (e.key === 'Enter' && (e.metaKey || e.ctrlKey) && !e.isComposing) {
          e.preventDefault();
          submitTalkEditor();
          return;
        }
        if (e.key === 'Backspace') {
          var sel = window.getSelection();
          if (sel && sel.isCollapsed && sel.rangeCount > 0) {
            var range = sel.getRangeAt(0);
            var node = range.startContainer;
            var offset = range.startOffset;
            if (node === editor && offset > 0) {
              var prev = editor.childNodes[offset - 1];
              if (prev && prev.nodeType === 1 && prev.classList.contains('inline-var-pill')) {
                e.preventDefault();
                prev.remove();
              }
            } else if (node.nodeType === 3 && offset === 0 && node.previousSibling) {
              var prevSib = node.previousSibling;
              if (prevSib.nodeType === 1 && prevSib.classList.contains('inline-var-pill')) {
                e.preventDefault();
                prevSib.remove();
              }
            }
          }
        }
      });

      editor.addEventListener('paste', function(e) {
        var items = (e.clipboardData && e.clipboardData.items) ? Array.from(e.clipboardData.items) : [];
        var imgFile = items.filter(function(it) { return it.type && it.type.indexOf('image/') === 0; })
          .map(function(it) { return it.getAsFile(); })
          .find(Boolean);
        if (imgFile) {
          e.preventDefault();
          compressImageToJpeg(imgFile).then(function(res) {
            state.pendingChatPhoto = res;
            renderChatPhotoPreview();
          }).catch(function() {});
        }
      });

      if (window.visualViewport) {
        window.visualViewport.addEventListener('resize', function() {
          var comp = document.getElementById('sharedComposer');
          if (!comp) return;
          var kbHeight = Math.max(0, window.innerHeight - window.visualViewport.height - window.visualViewport.offsetTop);
          comp.style.bottom = kbHeight > 80
            ? Math.max(0, kbHeight - 66) + 'px'
            : '';
        });
      }
    }

    window.addEventListener('DOMContentLoaded', function() {
      applyTheme();
      if (window.matchMedia) {
        var mq = window.matchMedia('(prefers-color-scheme: dark)');
        var onSchemeChange = function(ev) {
          var manual = '';
          try { manual = localStorage.getItem('companion_theme') || ''; } catch (e) {}
          if (!manual) {
            state.isDark = Boolean(ev.matches);
            applyTheme();
          }
        };
        if (mq.addEventListener) mq.addEventListener('change', onSchemeChange);
        else if (mq.addListener) mq.addListener(onSchemeChange);
      }
      initStaticIcons();
      bindComposerListeners();
      startMistCanvas();
      startLiveClocks();

      if (!isGasEnvironment() && 'serviceWorker' in navigator && window.location.protocol === 'https:') {
        navigator.serviceWorker.register('./sw.js').catch(function() {});
      }

      if (urlParams.key) {
        try { localStorage.setItem('companion_auth_key', urlParams.key.trim()); } catch (e) {}
      }
      if (urlParams.api) {
        try { localStorage.setItem('companion_api_url', urlParams.api.trim()); } catch (e) {}
      }

      var hasSnap = loadLocalSnapshot();
      renderAll();

      var needsApi = !isGasEnvironment() && !state.apiUrl;
      var needsKey = !state.authKey;
      if (needsApi || needsKey) {
        openSettingsModal();
      } else {
        syncFromServer(!hasSnap);
      }
    });

    document.addEventListener('visibilitychange', function() {
      if (document.visibilityState === 'visible' && state.authKey && (isGasEnvironment() || state.apiUrl)) {
        if (Date.now() - state.lastFetchedAt > 15000) {
          syncFromServer(false);
        }
      }
    });
  </script>
</body>
</html>
