<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>マイコックピット</title>
  <meta name="theme-color" content="#FDFCFF" id="metaThemeColor" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="manifest" href="./manifest.json" />
  <link rel="icon" type="image/svg+xml" href="./icon.svg" />
  <link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --dc-font-body: "Plus Jakarta Sans", "Zen Kaku Gothic New", -apple-system, "Hiragino Sans", sans-serif;
      --dc-font-display: "Plus Jakarta Sans", "Zen Kaku Gothic New", -apple-system, "Hiragino Sans", sans-serif;
      --dc-w-body: 400;
      --dc-w-display: 600;
      --dc-w-title: 500;
      --dc-w-timer: 400;
      --dc-tracking-display: -0.025em;

      --dc-bg-outer: #F5F2FA;
      --dc-stage-grad: linear-gradient(145deg, #F3F4FC 0%, #F6F1FC 52%, #FDF2F8 100%);
      --dc-bg-base: #FDFCFF;
      --dc-canvas-grad: linear-gradient(165deg, #FFFFFF 0%, #FAF6FF 50%, #FEF7FB 100%);

      --dc-glass-border: rgba(255, 255, 255, 0.78);
      --dc-glass-rim-outer: rgba(167, 139, 250, 0.16);
      --dc-glass-inset: rgba(255, 255, 255, 0.90);
      --dc-glass-bottom-refract: rgba(216, 180, 254, 0.18);

      --dc-card-glass: linear-gradient(135deg, rgba(255, 255, 255, 0.48) 0%, rgba(255, 255, 255, 0.26) 58%, rgba(248, 238, 255, 0.34) 100%);
      --dc-card-glass-hover: linear-gradient(135deg, rgba(255, 255, 255, 0.62) 0%, rgba(255, 255, 255, 0.38) 58%, rgba(248, 238, 255, 0.46) 100%);
      --dc-badge-glass: linear-gradient(135deg, rgba(255, 255, 255, 0.56), rgba(243, 232, 255, 0.28));
      --dc-badge-border: rgba(255, 255, 255, 0.82);
      --dc-badge-icon: #6D3FE0;

      --dc-dock-glass: rgba(255, 255, 255, 0.40);
      --dc-composer-glass: rgba(255, 255, 255, 0.46);
      --dc-nav-pill-glass: linear-gradient(135deg, rgba(255, 255, 255, 0.68), rgba(245, 234, 255, 0.48));
      --dc-nav-pill-border: rgba(255, 255, 255, 0.86);
      --dc-nav-pill-shadow: 0 4px 14px rgba(147, 94, 232, 0.10), inset 0 1px 0 rgba(255, 255, 255, 0.92);

      --dc-seg-glass: rgba(255, 255, 255, 0.32);
      --dc-seg-active-glass: rgba(255, 255, 255, 0.66);
      --dc-btn-soft-glass: rgba(255, 255, 255, 0.38);
      --dc-btn-soft-hover: rgba(255, 255, 255, 0.54);
      --dc-primary-link-glass: rgba(167, 139, 250, 0.18);

      --dc-bg-input: rgba(255, 255, 255, 0.46);
      --dc-subtle: rgba(236, 228, 252, 0.42);
      --dc-border: rgba(31, 23, 52, 0.08);
      --dc-border-strong: rgba(109, 63, 224, 0.18);
      --dc-fade-bottom: rgba(252, 249, 255, 0.36);

      --dc-text: #1F1734;
      --dc-text-sub: #695D86;

      --dc-accent: #8B5CF6;
      --dc-accent-grad: linear-gradient(135deg, rgba(132, 114, 246, 0.70) 0%, rgba(168, 110, 246, 0.66) 52%, rgba(234, 126, 200, 0.64) 100%);
      --dc-accent-grad-hover: linear-gradient(135deg, rgba(132, 114, 246, 0.82) 0%, rgba(168, 110, 246, 0.78) 52%, rgba(234, 126, 200, 0.76) 100%);
      --dc-accent-on: #FFFFFF;
      --dc-accent-soft: rgba(155, 114, 248, 0.15);
      --dc-accent-border: rgba(167, 139, 250, 0.36);
      --dc-accent-text: #6D3FE0;
      --dc-accent-glow: 0 8px 24px rgba(147, 94, 232, 0.20);

      --dc-prism-glass: linear-gradient(135deg, rgba(238, 228, 255, 0.44) 0%, rgba(252, 232, 247, 0.38) 55%, rgba(228, 238, 255, 0.42) 100%);
      --dc-prism-border: rgba(196, 152, 255, 0.56);
      --dc-prism-text: #6D3FE0;

      --dc-dismiss-glass: linear-gradient(135deg, rgba(96, 78, 134, 0.78), rgba(74, 58, 110, 0.86));

      --dc-pink-soft: rgba(236, 72, 153, 0.12);
      --dc-pink-border: rgba(236, 72, 153, 0.26);
      --dc-pink-text: #BE185D;

      --dc-blue-soft: rgba(99, 132, 248, 0.13);
      --dc-blue-border: rgba(99, 132, 248, 0.26);
      --dc-blue-text: #3B5BDB;

      --dc-orchid-soft: rgba(192, 132, 252, 0.15);
      --dc-orchid-border: rgba(192, 132, 252, 0.30);
      --dc-orchid-text: #7E22CE;

      --dc-toast-bg: rgba(31, 23, 52, 0.78);
      --dc-toast-text: #FAF7FF;
      --dc-toast-border: rgba(255, 255, 255, 0.26);

      --dc-dial-bg: radial-gradient(circle at 30% 25%, rgba(255, 255, 255, 0.56) 0%, rgba(255, 255, 255, 0.24) 65%, rgba(244, 232, 255, 0.32) 100%);
      --dc-dial-halo: conic-gradient(from 0deg, rgba(156, 194, 254, 0.44), rgba(186, 156, 255, 0.46), rgba(249, 178, 224, 0.42), rgba(174, 196, 255, 0.42), rgba(156, 194, 254, 0.44));

      --dc-shell-shadow: 0 28px 80px rgba(31, 23, 52, 0.11), 0 4px 18px rgba(139, 92, 246, 0.06);
      --dc-card-shadow: 0 8px 26px rgba(31, 23, 52, 0.05), 0 1px 3px rgba(31, 23, 52, 0.03);
      --dc-dock-shadow: 0 14px 36px rgba(31, 23, 52, 0.09), 0 2px 8px rgba(139, 92, 246, 0.07);
      --dc-modal-backdrop: rgba(24, 18, 42, 0.44);
      --dc-err-soft: rgba(225, 29, 72, 0.12);
      --dc-err-text: #BE123C;
      --dc-err-border: rgba(225, 29, 72, 0.30);
    }

    body.dc-dark {
      --dc-bg-outer: #0A0714;
      --dc-stage-grad: linear-gradient(145deg, #0B0A1B 0%, #10091E 50%, #160A1D 100%);
      --dc-bg-base: #0D091A;
      --dc-canvas-grad: linear-gradient(165deg, #100B22 0%, #0C0819 52%, #150A1F 100%);

      --dc-glass-border: rgba(255, 255, 255, 0.22);
      --dc-glass-rim-outer: rgba(167, 139, 250, 0.22);
      --dc-glass-inset: rgba(255, 255, 255, 0.22);
      --dc-glass-bottom-refract: rgba(192, 132, 252, 0.14);

      --dc-card-glass: linear-gradient(135deg, rgba(255, 255, 255, 0.13) 0%, rgba(255, 255, 255, 0.06) 58%, rgba(192, 132, 252, 0.12) 100%);
      --dc-card-glass-hover: linear-gradient(135deg, rgba(255, 255, 255, 0.19) 0%, rgba(255, 255, 255, 0.09) 58%, rgba(216, 180, 254, 0.17) 100%);
      --dc-badge-glass: linear-gradient(135deg, rgba(255, 255, 255, 0.16), rgba(167, 139, 250, 0.18));
      --dc-badge-border: rgba(255, 255, 255, 0.24);
      --dc-badge-icon: #DDD6FE;

      --dc-dock-glass: rgba(22, 16, 40, 0.50);
      --dc-composer-glass: rgba(22, 16, 40, 0.54);
      --dc-nav-pill-glass: linear-gradient(135deg, rgba(255, 255, 255, 0.16), rgba(192, 132, 252, 0.20));
      --dc-nav-pill-border: rgba(255, 255, 255, 0.24);
      --dc-nav-pill-shadow: 0 4px 14px rgba(0, 0, 0, 0.28), inset 0 1px 0 rgba(255, 255, 255, 0.24);

      --dc-seg-glass: rgba(255, 255, 255, 0.08);
      --dc-seg-active-glass: rgba(255, 255, 255, 0.18);
      --dc-btn-soft-glass: rgba(255, 255, 255, 0.10);
      --dc-btn-soft-hover: rgba(255, 255, 255, 0.16);
      --dc-primary-link-glass: rgba(167, 139, 250, 0.24);

      --dc-bg-input: rgba(22, 16, 40, 0.46);
      --dc-subtle: rgba(255, 255, 255, 0.10);
      --dc-border: rgba(255, 255, 255, 0.12);
      --dc-border-strong: rgba(255, 255, 255, 0.22);
      --dc-fade-bottom: rgba(13, 9, 26, 0.46);

      --dc-text: #FAF7FF;
      --dc-text-sub: #B4A7D6;

      --dc-accent: #A78BFA;
      --dc-accent-grad: linear-gradient(135deg, rgba(124, 108, 246, 0.70) 0%, rgba(168, 85, 247, 0.66) 52%, rgba(236, 72, 153, 0.64) 100%);
      --dc-accent-grad-hover: linear-gradient(135deg, rgba(124, 108, 246, 0.84) 0%, rgba(168, 85, 247, 0.80) 52%, rgba(236, 72, 153, 0.78) 100%);
      --dc-accent-on: #FFFFFF;
      --dc-accent-soft: rgba(167, 139, 250, 0.24);
      --dc-accent-border: rgba(196, 181, 253, 0.40);
      --dc-accent-text: #DDD6FE;
      --dc-accent-glow: 0 10px 28px rgba(147, 94, 232, 0.36);

      --dc-prism-glass: linear-gradient(135deg, rgba(139, 92, 246, 0.24) 0%, rgba(217, 70, 239, 0.18) 55%, rgba(99, 102, 241, 0.22) 100%);
      --dc-prism-border: rgba(216, 180, 254, 0.38);
      --dc-prism-text: #EDE9FE;

      --dc-dismiss-glass: linear-gradient(135deg, rgba(76, 56, 118, 0.82), rgba(50, 36, 84, 0.88));

      --dc-pink-soft: rgba(244, 114, 182, 0.18);
      --dc-pink-border: rgba(244, 114, 182, 0.36);
      --dc-pink-text: #F9A8D4;

      --dc-blue-soft: rgba(129, 140, 248, 0.18);
      --dc-blue-border: rgba(129, 140, 248, 0.36);
      --dc-blue-text: #C7D2FE;

      --dc-orchid-soft: rgba(216, 180, 254, 0.18);
      --dc-orchid-border: rgba(216, 180, 254, 0.36);
      --dc-orchid-text: #E9D5FF;

      --dc-toast-bg: rgba(250, 247, 255, 0.84);
      --dc-toast-text: #1F1734;
      --dc-toast-border: rgba(255, 255, 255, 0.68);

      --dc-dial-bg: radial-gradient(circle at 30% 25%, rgba(255, 255, 255, 0.16) 0%, rgba(20, 14, 42, 0.34) 65%, rgba(139, 92, 246, 0.16) 100%);
      --dc-dial-halo: conic-gradient(from 0deg, rgba(129, 140, 248, 0.52), rgba(192, 132, 252, 0.54), rgba(244, 114, 182, 0.50), rgba(147, 197, 253, 0.46), rgba(129, 140, 248, 0.52));

      --dc-shell-shadow: 0 36px 96px rgba(0, 0, 0, 0.72), 0 0 0 1px rgba(255, 255, 255, 0.06);
      --dc-card-shadow: 0 12px 30px rgba(0, 0, 0, 0.34);
      --dc-dock-shadow: 0 16px 40px rgba(0, 0, 0, 0.48);
      --dc-modal-backdrop: rgba(8, 5, 18, 0.68);
      --dc-err-soft: rgba(251, 113, 133, 0.16);
      --dc-err-text: #FDA4AF;
      --dc-err-border: rgba(251, 113, 133, 0.34);
    }

    *, *::before, *::after {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      width: 100%;
      overflow: hidden;
      background-color: var(--dc-bg-outer);
      background-image: var(--dc-stage-grad);
      color: var(--dc-text);
      font-family: var(--dc-font-body);
      font-size: 14px;
      font-weight: var(--dc-w-body);
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    button, input {
      font-family: inherit;
      font-size: inherit;
      color: inherit;
    }

    button {
      border: none;
      background: transparent;
      cursor: pointer;
      padding: 0;
    }

    .hidden {
      display: none !important;
    }

    .stage {
      width: 100%;
      height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .app-shell {
      width: 100%;
      max-width: 440px;
      height: 100%;
      max-height: 880px;
      background-color: var(--dc-bg-base);
      background-image: var(--dc-canvas-grad);
      border: 1px solid var(--dc-glass-border);
      border-radius: 34px;
      box-shadow: var(--dc-shell-shadow);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      position: relative;
      isolation: isolate;
    }

    @media (max-width: 520px) {
      .stage {
        padding: 0;
      }
      .app-shell {
        max-width: 100%;
        max-height: none;
        border-radius: 0;
        border: none;
        box-shadow: none;
      }
    }

    .ambient-layer {
      position: absolute;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      overflow: hidden;
    }

    .ambient-canvas {
      position: absolute;
      inset: -16px;
      width: calc(100% + 32px);
      height: calc(100% + 32px);
      display: block;
      filter: blur(18px);
    }

    .frost-grain {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      opacity: 0.028;
      pointer-events: none;
      mix-blend-mode: overlay;
    }

    .glass-surface {
      background: var(--dc-card-glass);
      backdrop-filter: blur(18px) saturate(180%);
      -webkit-backdrop-filter: blur(18px) saturate(180%);
      border: 1px solid var(--dc-glass-border);
      box-shadow: var(--dc-card-shadow), inset 0 1.5px 1px var(--dc-glass-inset), inset 0 -1px 1px var(--dc-glass-bottom-refract), 0 0 0 0.5px var(--dc-glass-rim-outer);
    }

    .screen-body {
      position: relative;
      z-index: 1;
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .scroll-area {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      display: flex;
      flex-direction: column;
    }

    #tab-home .scroll-area {
      padding: calc(34px + env(safe-area-inset-top)) 18px calc(98px + env(safe-area-inset-bottom));
    }
    #tab-talk .scroll-area {
      padding: calc(34px + env(safe-area-inset-top)) 16px 152px;
    }
    #tab-lists .scroll-area {
      padding: 12px 16px calc(158px + env(safe-area-inset-bottom));
    }

    .scroll-area::-webkit-scrollbar {
      width: 4px;
    }
    .scroll-area::-webkit-scrollbar-thumb {
      background-color: var(--dc-border-strong);
      border-radius: 999px;
    }

    .home-header {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 18px;
    }

    .meta-top-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .meta-line {
      font-size: 12px;
      font-weight: 500;
      color: var(--dc-text-sub);
      letter-spacing: 0.01em;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .meta-tools {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }

    .icon-pill-btn {
      width: 28px;
      height: 28px;
      border-radius: 999px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--dc-btn-soft-glass);
      backdrop-filter: blur(14px) saturate(180%);
      -webkit-backdrop-filter: blur(14px) saturate(180%);
      border: 1px solid var(--dc-glass-border);
      color: var(--dc-text-sub);
      transition: all 0.16s ease;
    }
    .icon-pill-btn:hover {
      color: var(--dc-text);
      background: var(--dc-btn-soft-hover);
    }
    .spinning {
      animation: spinSlow 0.9s linear infinite;
    }
    @keyframes spinSlow {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    .boundary-hero {
      display: flex;
      flex-direction: column;
      gap: 3px;
      margin-top: 2px;
    }

    .boundary-next-row {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 12.5px;
      font-weight: 500;
      color: var(--dc-text-sub);
      line-height: 1.35;
    }

    .boundary-next-dot {
      width: 6px;
      height: 6px;
      border-radius: 999px;
      background: var(--dc-accent-grad);
      flex-shrink: 0;
    }

    .boundary-countdown {
      margin: 0;
      font-family: var(--dc-font-display);
      font-size: 38px;
      font-weight: 500;
      letter-spacing: -0.02em;
      font-variant-numeric: tabular-nums;
      line-height: 1.08;
      color: var(--dc-text);
    }

    .boundary-sleep-text {
      margin: 0;
      font-family: var(--dc-font-display);
      font-size: 24px;
      font-weight: 600;
      letter-spacing: var(--dc-tracking-display);
      line-height: 1.25;
      color: var(--dc-text);
    }

    .sub-context-line {
      font-size: 12px;
      color: var(--dc-text-sub);
      margin-top: 2px;
    }

    .briefing-card {
      padding: 14px 15px;
      border-radius: 22px;
      margin-bottom: 14px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .briefing-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .briefing-kicker {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      font-weight: 600;
      color: var(--dc-accent-text);
    }

    .briefing-close {
      width: 24px;
      height: 24px;
      border-radius: 999px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--dc-text-sub);
    }
    .briefing-close:hover {
      background: var(--dc-subtle);
      color: var(--dc-text);
    }

    .briefing-line {
      font-size: 12.5px;
      color: var(--dc-text);
      line-height: 1.48;
    }

    .cards-stack {
      display: flex;
      flex-direction: column;
      gap: 11px;
    }

    .swipe-wrap {
      position: relative;
      border-radius: 22px;
      overflow: hidden;
    }

    .swipe-behind {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      background: var(--dc-dismiss-glass);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-radius: 22px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.16s ease;
    }
    .swipe-wrap.swiping .swipe-behind,
    .swipe-wrap.swipe-open .swipe-behind {
      opacity: 1;
      pointer-events: auto;
    }

    .swipe-dismiss-btn {
      height: 100%;
      width: 118px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      color: #FFFFFF;
      font-size: 12px;
      font-weight: 600;
      padding: 0 8px;
    }

    .action-card {
      position: relative;
      z-index: 1;
      width: 100%;
      text-align: left;
      padding: 14px 16px;
      border-radius: 22px;
      background: var(--dc-card-glass);
      backdrop-filter: blur(18px) saturate(180%);
      -webkit-backdrop-filter: blur(18px) saturate(180%);
      border: 1px solid var(--dc-glass-border);
      box-shadow: var(--dc-card-shadow), inset 0 1.5px 1px var(--dc-glass-inset), inset 0 -1px 1px var(--dc-glass-bottom-refract), 0 0 0 0.5px var(--dc-glass-rim-outer);
      display: flex;
      align-items: center;
      gap: 13px;
      touch-action: pan-y;
      user-select: none;
      cursor: pointer;
      transition: transform 0.22s cubic-bezier(0.22, 1, 0.36, 1), background 0.18s ease, border-color 0.18s ease;
    }
    .action-card:hover {
      background: var(--dc-card-glass-hover);
      border-color: var(--dc-accent-border);
    }
    .action-card.triage {
      background: var(--dc-prism-glass);
      border-color: var(--dc-prism-border);
    }

    .card-icon-badge {
      width: 40px;
      height: 40px;
      border-radius: 14px;
      background: var(--dc-badge-glass);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--dc-badge-border);
      box-shadow: inset 0 1px 0 var(--dc-glass-inset), 0 4px 12px rgba(31, 23, 52, 0.04);
      color: var(--dc-badge-icon);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .action-card.triage .card-icon-badge {
      background: var(--dc-accent-soft);
      border-color: var(--dc-prism-border);
      color: var(--dc-prism-text);
    }

    .card-body {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .card-row1 {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .card-title {
      font-size: 14.5px;
      font-weight: var(--dc-w-title);
      color: var(--dc-text);
      line-height: 1.38;
      letter-spacing: -0.01em;
    }

    .card-right {
      display: inline-flex;
      align-items: center;
      gap: 3px;
      font-size: 12px;
      font-weight: 500;
      color: var(--dc-text-sub);
      flex-shrink: 0;
    }

    .triage-badge {
      font-weight: 600;
      color: var(--dc-prism-text);
    }

    .card-row2 {
      font-size: 12px;
      color: var(--dc-text-sub);
      line-height: 1.44;
    }

    .subtle-actions {
      display: flex;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 16px;

    .text-link {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 12px;
      font-weight: 500;
      color: var(--dc-text-sub);

      background: var(--dc-btn-soft-glass);

    .custom-create-card {

      flex-direction: column;
      gap: 11px;

    .custom-input {
      width: 100%;
      padding: 10px 13px;
      border-radius: 13px;
      background: var(--dc-bg-input);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--dc-glass-border);
      box-shadow: inset 0 1px 0 var(--dc-glass-inset);
      color: var(--dc-text);
      font-size: 14px;
      outline: none;

    .custom-input::placeholder {
      color: var(--dc-text-sub);
    }
    .custom-input:focus {
      border-color: var(--dc-accent);
    }

    .dur-slider-wrap {

      gap: 7px;
      padding: 4px 2px 2px;
    }

    .dur-slider-head {

      align-items: center;
      justify-content: flex-end;
    }

    .dur-slider-val {
      padding: 3px 11px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
      background: var(--dc-accent-grad);
      border: 1px solid rgba(255, 255, 255, 0.48);
      box-shadow: 0 3px 10px rgba(147, 94, 232, 0.20), inset 0 1px 0 rgba(255, 255, 255, 0.45);
      color: var(--dc-accent-on);
    }

    .dur-slider {
      width: 100%;
      height: 6px;
      margin: 4px 0;
      -webkit-appearance: none;
      appearance: none;
      border-radius: 999px;
      background: var(--dc-seg-glass);
      border: 1px solid var(--dc-glass-border);
      outline: none;
      cursor: pointer;
    }

    .dur-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 22px;
      height: 22px;
      border-radius: 999px;
      background: var(--dc-accent-grad);
      border: 2px solid rgba(255, 255, 255, 0.88);
      box-shadow: 0 4px 12px rgba(139, 92, 246, 0.34);
      cursor: pointer;
    }

    .dur-slider::-moz-range-thumb {
      width: 22px;
      height: 22px;
      border-radius: 999px;
      background: var(--dc-accent);
      border: 2px solid rgba(255, 255, 255, 0.88);
      box-shadow: 0 4px 12px rgba(139, 92, 246, 0.34);
      cursor: pointer;
    }

    .dur-slider-ticks {
      position: relative;
      height: 15px;
      font-size: 10.5px;
      color: var(--dc-text-sub);
      user-select: none;
    }

    .dur-slider-ticks span {
      position: absolute;
      transform: translateX(-50%);
      white-space: nowrap;
    }

    .dur-slider-ticks span:first-child {
      left: 0;
      transform: none;
    }

    .dur-slider-ticks span:last-child {
      right: 0;
      left: auto;
      transform: none;
    }

    .custom-btns {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
    }

    .btn-soft {
      padding: 7px 14px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 500;
      background: var(--dc-btn-soft-glass);
      backdrop-filter: blur(16px) saturate(180%);
      -webkit-backdrop-filter: blur(16px) saturate(180%);
      border: 1px solid var(--dc-glass-border);
      box-shadow: inset 0 1px 0 var(--dc-glass-inset);
      color: var(--dc-text-sub);
    }

    .btn-solid {
      padding: 7px 16px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 600;
      background: var(--dc-accent-grad);
      backdrop-filter: blur(16px) saturate(190%);
      -webkit-backdrop-filter: blur(16px) saturate(190%);
      border: 1px solid rgba(255, 255, 255, 0.48);
      color: var(--dc-accent-on);
      box-shadow: 0 4px 14px rgba(147, 94, 232, 0.24), inset 0 1.5px 1px rgba(255, 255, 255, 0.46);
    }

    .focus-view {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 8px 6px 12px;
      gap: 16px;
    }

    .focus-title {
      margin: 0;
      font-family: var(--dc-font-display);
      font-size: 20px;
      font-weight: var(--dc-w-display);
      letter-spacing: var(--dc-tracking-display);
      line-height: 1.4;
      color: var(--dc-text);
      max-width: 310px;
    }

    .focus-dial {
      position: relative;
      width: 214px;
      height: 214px;
      border-radius: 999px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      isolation: isolate;
      margin: 4px 0;
    }

    .focus-dial::before {
      content: "";
      position: absolute;
      inset: -12px;
      border-radius: 999px;
      background: var(--dc-dial-halo);
      filter: blur(18px);
      opacity: 0.78;
      z-index: -1;
    }

    .focus-dial-inner {
      width: 100%;
      height: 100%;
      border-radius: 999px;
      background: var(--dc-dial-bg);
      backdrop-filter: blur(18px) saturate(185%);
      -webkit-backdrop-filter: blur(18px) saturate(185%);
      border: 1.5px solid var(--dc-glass-border);
      box-shadow: var(--dc-card-shadow), inset 0 2px 2px var(--dc-glass-inset), inset 0 -4px 12px var(--dc-glass-bottom-refract);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .focus-kicker {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 12px;
      font-weight: 600;
      color: var(--dc-accent-text);
      background: var(--dc-accent-soft);
      border: 1px solid var(--dc-accent-border);
      padding: 4px 12px;
      border-radius: 999px;
    }

    .focus-timer {
      font-family: var(--dc-font-display);
      font-size: 44px;
      font-weight: var(--dc-w-timer);
      letter-spacing: -0.03em;
      font-variant-numeric: tabular-nums;
      color: var(--dc-text);
      line-height: 1.1;
    }

    .focus-gentle-note {
      font-size: 12px;
      font-weight: 600;
      color: var(--dc-prism-text);
      background: var(--dc-prism-glass);
      border: 1px solid var(--dc-prism-border);
      padding: 6px 14px;
      border-radius: 999px;
    }

    .focus-actions {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin-top: 2px;
    }

    .btn-done-pill {
      padding: 13px 34px;
      border-radius: 999px;
      background: var(--dc-accent-grad);
      backdrop-filter: blur(16px) saturate(190%);
      -webkit-backdrop-filter: blur(16px) saturate(190%);
      border: 1px solid rgba(255, 255, 255, 0.48);
      color: var(--dc-accent-on);
      font-size: 15px;
      font-weight: 600;
      box-shadow: var(--dc-accent-glow), inset 0 1.5px 1px rgba(255, 255, 255, 0.46);
      transition: transform 0.14s ease;
    }
    .btn-done-pill:active {
      transform: scale(0.96);
    }

    .btn-pause-soft {
      padding: 12px 22px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 500;
      background: var(--dc-btn-soft-glass);
      border: 1px solid var(--dc-glass-border);
      box-shadow: var(--dc-card-shadow), inset 0 1px 0 var(--dc-glass-inset);
      color: var(--dc-text-sub);
    }

    .reflect-view {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 16px;
      padding: 8px 2px;
    }

    .reflect-heading {
      margin: 0;
      font-family: var(--dc-font-display);
      font-size: 24px;
      font-weight: var(--dc-w-display);
      letter-spacing: var(--dc-tracking-display);
    }

    .reflect-sub {
      font-size: 12.5px;
      color: var(--dc-text-sub);
      margin-top: -10px;
    }

    .feeling-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .feeling-chip {
      padding: 7px 13px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 500;
      background: var(--dc-btn-soft-glass);
      backdrop-filter: blur(16px) saturate(180%);
      -webkit-backdrop-filter: blur(16px) saturate(180%);
      border: 1px solid var(--dc-glass-border);
      box-shadow: 0 4px 12px rgba(31, 23, 52, 0.04), inset 0 1px 0 var(--dc-glass-inset);
      color: var(--dc-text);
    }
    .feeling-chip.selected {
      background: var(--dc-accent-grad);
      color: var(--dc-accent-on);
      font-weight: 600;
      border: 1px solid rgba(255, 255, 255, 0.48);
      box-shadow: 0 4px 12px rgba(147, 94, 232, 0.24), inset 0 1.5px 1px rgba(255, 255, 255, 0.46);
    }

    .reflect-input-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .reflect-input {
      flex: 1;
      min-width: 0;
      padding: 13px 15px;
      border-radius: 18px;
      background: var(--dc-bg-input);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--dc-glass-border);
      box-shadow: inset 0 1px 0 var(--dc-glass-inset);
      color: var(--dc-text);
      font-size: 14px;
      outline: none;
    }
    .reflect-input::placeholder {
      color: var(--dc-text-sub);
    }
    .reflect-input:focus {
      border-color: var(--dc-accent);
    }

    .attach-btn-glass {
      width: 44px;
      height: 44px;
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--dc-btn-soft-glass);
      backdrop-filter: blur(16px) saturate(180%);
      -webkit-backdrop-filter: blur(16px) saturate(180%);
      border: 1px solid var(--dc-glass-border);
      box-shadow: 0 4px 12px rgba(31, 23, 52, 0.04), inset 0 1px 0 var(--dc-glass-inset);
      color: var(--dc-text-sub);
      flex-shrink: 0;
    }

    .attach-preview-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      pointer-events: auto;
    }
    .attach-thumb-wrap {
      position: relative;
      display: inline-block;
    }
    .attach-thumb {
      width: 58px;
      height: 58px;
      object-fit: cover;
      border-radius: 14px;
      border: 1px solid var(--dc-glass-border);
      box-shadow: var(--dc-card-shadow);
      display: block;
    }
    .attach-remove-btn {
      position: absolute;
      top: -6px;
      right: -6px;
      width: 20px;
      height: 20px;
      border-radius: 999px;
      background: var(--dc-toast-bg);
      color: var(--dc-toast-text);
      border: 1px solid var(--dc-toast-border);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      font-weight: 700;
    }

    .btn-next-full {
      width: 100%;
      padding: 13px;
      border-radius: 18px;
      background: var(--dc-accent-grad);
      border: 1px solid rgba(255, 255, 255, 0.48);
      color: var(--dc-accent-on);
      font-size: 14px;
      font-weight: 600;
      box-shadow: var(--dc-accent-glow), inset 0 1.5px 1px rgba(255, 255, 255, 0.46);
    }
    .btn-next-full:disabled {
      opacity: 0.6;
      cursor: wait;
    }

    /* Chat */
    .chat-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .chat-empty {
      text-align: center;
      padding: 40px 16px;
      font-size: 13px;
      color: var(--dc-text-sub);
    }

    .bubble-wrap {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .bubble-wrap.user {
      align-items: flex-end;
    }
    .bubble-wrap.ai {
      align-items: flex-start;
    }

    .bubble {
      max-width: 85%;
      padding: 11px 15px;
      border-radius: 20px;
      font-size: 13.5px;
      font-weight: 500;
      line-height: 1.55;
      word-break: break-word;
      white-space: pre-wrap;
    }
    .bubble-wrap.user .bubble {
      background: var(--dc-accent-grad);
      backdrop-filter: blur(16px) saturate(190%);
      -webkit-backdrop-filter: blur(16px) saturate(190%);
      border: 1px solid rgba(255, 255, 255, 0.48);
      color: var(--dc-accent-on);
      border-bottom-right-radius: 6px;
      box-shadow: 0 8px 20px rgba(147, 94, 232, 0.22), inset 0 1.5px 1px rgba(255, 255, 255, 0.42);
    }
    .bubble-wrap.ai .bubble {
      background: var(--dc-card-glass);
      backdrop-filter: blur(18px) saturate(180%);
      -webkit-backdrop-filter: blur(18px) saturate(180%);
      color: var(--dc-text);
      border: 1px solid var(--dc-glass-border);
      box-shadow: var(--dc-card-shadow), inset 0 1.5px 1px var(--dc-glass-inset), inset 0 -1px 1px var(--dc-glass-bottom-refract);
      border-bottom-left-radius: 6px;
    }

    .bubble-photo {
      display: block;
      max-width: 220px;
      max-height: 220px;
      object-fit: cover;
      border-radius: 14px;
      margin-bottom: 6px;
      border: 1px solid rgba(255, 255, 255, 0.35);
      cursor: zoom-in;
    }

    .bubble-time {
      font-size: 10.5px;
      color: var(--dc-text-sub);
      padding: 0 4px;
    }

    .quiet-badges-row {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      margin-top: 6px;
    }
    .quiet-badge {
      display: inline-block;
      padding: 3px 9px;
      border-radius: 8px;
      font-size: 11.5px;
      font-weight: 600;
      background: var(--dc-accent-soft);
      border: 1px solid var(--dc-accent-border);
      color: var(--dc-accent-text);
    }

    .doc-links-row {
      display: flex;
      flex-direction: column;
      gap: 5px;
      margin-top: 7px;
    }
    .doc-link-btn {
      display: inline-flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 6px 10px;
      border-radius: 10px;
      font-size: 12px;
      font-weight: 600;
      text-decoration: none;
      background: var(--dc-btn-soft-glass);
      border: 1px solid var(--dc-glass-border);
      color: var(--dc-accent-text);
    }

    .dc-url-text {
      color: inherit;
      text-decoration: underline;
      word-break: break-all;
    }

    .reaction-chip {
      display: inline-flex;
      align-items: center;
      margin-top: 2px;
      padding: 3px 9px;
      border-radius: 999px;
      font-size: 13px;
      line-height: 1.2;
      background: var(--dc-card-glass);
      backdrop-filter: blur(14px) saturate(180%);
      -webkit-backdrop-filter: blur(14px) saturate(180%);
      border: 1px solid var(--dc-glass-border);
      box-shadow: 0 3px 10px rgba(31, 23, 52, 0.06), inset 0 1px 0 var(--dc-glass-inset);
    }

    .thinking-bubble {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 11px 16px;
      border-radius: 20px;
      border-bottom-left-radius: 6px;
      background: var(--dc-card-glass);
      border: 1px solid var(--dc-glass-border);
    }
    .thinking-dot {
      width: 6px;
      height: 6px;
      border-radius: 999px;
      background: var(--dc-accent);
      animation: dotPulse 1.2s infinite ease-in-out;
    }
    .thinking-dot:nth-child(2) { animation-delay: 0.2s; }
    .thinking-dot:nth-child(3) { animation-delay: 0.4s; }
    @keyframes dotPulse {
      0%, 80%, 100% { opacity: 0.3; transform: scale(0.8); }
      40% { opacity: 1; transform: scale(1.1); }
    }

    .error-card {
      padding: 12px 14px;
      border-radius: 18px;
      background: var(--dc-err-soft);
      border: 1px solid var(--dc-err-border);
      color: var(--dc-text);
      font-size: 12.5px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-width: 88%;
    }
    .error-title {
      font-weight: 600;
      color: var(--dc-err-text);
    }
    .error-actions {
      display: flex;
      gap: 8px;
    }

    .bottom-dock {
      position: absolute;
      left: 14px;
      right: 14px;
      bottom: 8px;
      z-index: 20;
      display: flex;
      flex-direction: column;
      gap: 6px;
      pointer-events: none;
    }

    .shared-composer {
      position: relative;
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 8px;
      pointer-events: none;
    }

    .quick-row {
      display: flex;
      align-items: center;
      gap: 6px;
      overflow-x: auto;
      scrollbar-width: none;
      pointer-events: auto;
    }
    .quick-row::-webkit-scrollbar {
      display: none;
    }

    .quick-chip {
      white-space: nowrap;
      padding: 6px 12px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 500;
      background: var(--dc-btn-soft-glass);
      backdrop-filter: blur(16px) saturate(180%);
      -webkit-backdrop-filter: blur(16px) saturate(180%);
      border: 1px solid var(--dc-glass-border);
      box-shadow: 0 4px 12px rgba(31, 23, 52, 0.04), inset 0 1px 0 var(--dc-glass-inset);
      color: var(--dc-text);
      flex-shrink: 0;
    }

    .attach-circle {
      width: 34px;
      height: 34px;
      border-radius: 999px;
      background: var(--dc-btn-soft-glass);
      border: 1px solid var(--dc-glass-border);
      color: var(--dc-text-sub);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .composer-row {
      display: flex;
      align-items: flex-end;
      gap: 8px;
      background: var(--dc-composer-glass);
      backdrop-filter: blur(20px) saturate(190%);
      -webkit-backdrop-filter: blur(20px) saturate(190%);
      border: 1px solid var(--dc-glass-border);
      border-radius: 26px;
      padding: 7px 7px 7px 9px;
      box-shadow: var(--dc-dock-shadow), inset 0 1.5px 1px var(--dc-glass-inset);
      pointer-events: auto;
    }

    .talk-editor {
      flex: 1;
      min-width: 0;
      min-height: 22px;
      max-height: 92px;
      overflow-y: auto;
      outline: none;
      font-size: 13.5px;
      line-height: 1.55;
      white-space: pre-wrap;
      word-break: break-word;
      padding: 3px 0;
      color: var(--dc-text);
    }
    .talk-editor:empty::before {
      content: attr(data-placeholder);
      color: var(--dc-text-sub);
      pointer-events: none;
    }

    .inline-var-pill {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      border-radius: 8px;
      padding: 1px 7px;
      margin: 1px 2px;
      font-size: 12px;
      font-weight: 600;
      line-height: 1.4;
      vertical-align: baseline;
      user-select: none;
      background: var(--dc-accent-soft);
      color: var(--dc-accent-text);
      border: 1px solid var(--dc-accent-border);
    }
    .inline-var-pill[data-kind="shopping"] {
      background: var(--dc-pink-soft);
      color: var(--dc-pink-text);
      border-color: var(--dc-pink-border);
    }
    .inline-var-pill[data-kind="stock"] {
      background: var(--dc-blue-soft);
      color: var(--dc-blue-text);
      border-color: var(--dc-blue-border);
    }
    .inline-var-pill[data-kind="habits"] {
      background: var(--dc-orchid-soft);
      color: var(--dc-orchid-text);
      border-color: var(--dc-orchid-border);

    .bubble-wrap.user .inline-var-pill {
      background: rgba(255, 255, 255, 0.24);
      color: #FFFFFF;
      border-color: rgba(255, 255, 255, 0.44);
    }

    .pill-remove {
      font-size: 12px;
      opacity: 0.72;
      cursor: pointer;
      padding: 0 2px;
    }

    .send-circle {
      width: 34px;
      height: 34px;
      border-radius: 999px;
      background: var(--dc-accent-grad);
      border: 1px solid rgba(255, 255, 255, 0.48);
      color: var(--dc-accent-on);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      box-shadow: 0 4px 12px rgba(147, 94, 232, 0.24), inset 0 1.5px 1px rgba(255, 255, 255, 0.46);
    }

    .lists-header {
      padding: calc(34px + env(safe-area-inset-top)) 16px 10px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .seg-bar {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 4px;
      padding: 4px;
      border-radius: 16px;
      background: var(--dc-seg-glass);
      backdrop-filter: blur(18px) saturate(180%);
      -webkit-backdrop-filter: blur(18px) saturate(180%);
      border: 1px solid var(--dc-glass-border);
      box-shadow: inset 0 1px 0 var(--dc-glass-inset);
    }

    .seg-btn {
      padding: 6px 4px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 500;
      color: var(--dc-text-sub);
      text-align: center;
    }
    .seg-btn.active {
      background: var(--dc-seg-active-glass);
      color: var(--dc-text);
      font-weight: 600;
      border: 1px solid var(--dc-nav-pill-border);
      box-shadow: 0 2px 8px rgba(31, 23, 52, 0.06);
    }

    .cat-row {
      display: flex;
      align-items: center;
      gap: 6px;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .cat-row::-webkit-scrollbar {
      display: none;
    }

    .cat-chip {
      white-space: nowrap;
      padding: 5px 11px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 500;
      background: var(--dc-btn-soft-glass);
      border: 1px solid var(--dc-glass-border);
      color: var(--dc-text-sub);
      flex-shrink: 0;
    }
    .cat-chip.active {
      background: var(--dc-accent-grad);
      color: var(--dc-accent-on);
      font-weight: 600;
      border: 1px solid rgba(255, 255, 255, 0.48);
      box-shadow: 0 4px 12px rgba(147, 94, 232, 0.20);
    }

    .list-cards {
      display: flex;
      flex-direction: column;
      gap: 9px;
    }

    .list-item {
      padding: 13px 14px;
      border-radius: 20px;
      background: var(--dc-card-glass);
      backdrop-filter: blur(18px) saturate(180%);
      -webkit-backdrop-filter: blur(18px) saturate(180%);
      border: 1px solid var(--dc-glass-border);
      box-shadow: var(--dc-card-shadow), inset 0 1.5px 1px var(--dc-glass-inset), inset 0 -1px 1px var(--dc-glass-bottom-refract);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      cursor: pointer;
    }
    .list-item.done {
      opacity: 0.50;
    }

    .list-item-main {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .list-item-title {
      font-size: 13.5px;
      font-weight: var(--dc-w-title);
      line-height: 1.38;
      color: var(--dc-text);
    }

    .list-item-meta {
      font-size: 12px;
      color: var(--dc-text-sub);
    }

    .circle-action-btn {
      width: 34px;
      height: 34px;
      border-radius: 999px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--dc-accent-soft);
      color: var(--dc-accent-text);
      border: 1px solid var(--dc-accent-border);
      flex-shrink: 0;
    }
    .circle-action-btn:hover {
      background: var(--dc-accent-grad);
      color: var(--dc-accent-on);
    }

    .bottom-fade-veil {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: calc(76px + env(safe-area-inset-bottom));
      z-index: 10;
      pointer-events: none;
      background: linear-gradient(to top, var(--dc-fade-bottom) 0%, transparent 100%);
    }

    .bottom-nav {
      position: relative;
      width: 100%;
      height: 60px;
      padding: 5px;
      border-radius: 999px;
      pointer-events: auto;
      background: var(--dc-dock-glass);
      backdrop-filter: blur(20px) saturate(190%);
      -webkit-backdrop-filter: blur(20px) saturate(190%);
      border: 1px solid var(--dc-glass-border);
      box-shadow: var(--dc-dock-shadow), inset 0 1.5px 1px var(--dc-glass-inset), inset 0 -1px 0 var(--dc-glass-bottom-refract);
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 4px;
    }

    .nav-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
      border-radius: 999px;
      color: var(--dc-text-sub);
      font-size: 12px;
      font-weight: 500;
    }
    .nav-btn.active {
      color: var(--dc-accent-text);
      font-weight: 600;
      background: var(--dc-nav-pill-glass);
      border: 1px solid var(--dc-nav-pill-border);
      box-shadow: var(--dc-nav-pill-shadow);
    }

    .toast {
      position: fixed;
      top: calc(34px + env(safe-area-inset-top));
      left: 50%;
      transform: translateX(-50%);
      padding: 8px 16px;
      border-radius: 999px;
      background: var(--dc-toast-bg);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border: 1px solid var(--dc-toast-border);
      color: var(--dc-toast-text);
      font-size: 12px;
      font-weight: 600;
      white-space: nowrap;
      z-index: 80;
      pointer-events: none;
    }

    /* Modals & Lightbox */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 60;
      background: var(--dc-modal-backdrop);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 18px;
    }

    .modal-sheet {
      width: 100%;
      max-width: 380px;
      border-radius: 26px;
      padding: 20px;
      background: var(--dc-bg-base);
      background-image: var(--dc-canvas-grad);
      border: 1px solid var(--dc-glass-border);
      box-shadow: var(--dc-shell-shadow);
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 16px;
      font-weight: 600;
    }

    .field-group {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .field-label {
      font-size: 12px;
      font-weight: 500;
      color: var(--dc-text-sub);
    }

    .modal-error {
      font-size: 12px;
      color: var(--dc-err-text);
      background: var(--dc-err-soft);
      border: 1px solid var(--dc-err-border);
      border-radius: 12px;
      padding: 8px 10px;
    }

    .settings-row-btn {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 13px;
      border-radius: 14px;
      background: var(--dc-btn-soft-glass);
      border: 1px solid var(--dc-glass-border);
      font-size: 13px;
      font-weight: 500;
    }

    .lightbox-img {
      max-width: 100%;
      max-height: 85dvh;
      border-radius: 16px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.55);
    }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(5px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .fade-in {
      animation: fadeInUp 0.2s ease-out both;
    }

    .time-adjust-wrap {
      margin-top: 10px;
      text-align: center;
      width: 100%;
    }
    .time-adjust-toggle {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: var(--dc-btn-soft-glass);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--dc-glass-border);
      box-shadow: inset 0 1px 0 var(--dc-glass-inset);
      color: var(--dc-text-sub);
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      padding: 6px 14px;
      border-radius: 999px;

    .time-adjust-toggle:active {

      transform: scale(0.97);
    }
    .time-adjust-panel {
      display: inline-flex;
      flex-direction: column;
      gap: 10px;
      padding: 12px 16px;
      border-radius: 18px;
    }
    .time-adjust-input {
      background: var(--dc-btn-soft-glass);
      border: 1px solid var(--dc-glass-border);
      color: var(--dc-text-main);
      border-radius: 10px;
      padding: 5px 10px;
      font-size: 14px;
      font-weight: 500;
      font-family: inherit;
    }

    /* Paused Session (Hold) Bar & 3-button focus actions */
    .focus-actions {
      gap: 8px;
      flex-wrap: nowrap;
    }
    .focus-actions .btn-pause-soft,
    .focus-actions .btn-done-pill {
      padding-left: 14px;
      padding-right: 14px;
      font-size: 13px;
      white-space: nowrap;
    }
    .paused-session-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 10px 14px;
      margin: 0 0 12px 0;
      border-radius: 18px;
      font-size: 13px;
    }
    .paused-session-info {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
      flex: 1;
    }
    .paused-session-badge {
      font-size: 11px;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 999px;
      background: var(--dc-btn-soft-glass);
      border: 1px solid var(--dc-glass-border);
      color: var(--dc-text-sub);
      white-space: nowrap;
    }
    .paused-session-title {
      font-weight: 600;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .paused-session-actions {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }
    .paused-session-btn {
      padding: 6px 10px;
      font-size: 12px;
      border-radius: 999px;
    }
  </style>
</head>
<body>
  <div class="stage">
    <div id="appShell" class="app-shell">
      <div id="ambientLayer" class="ambient-layer">
        <canvas id="ambientCanvas" class="ambient-canvas" aria-hidden="true"></canvas>
        <svg class="frost-grain" aria-hidden="true">
          <filter id="frostNoise">
            <feTurbulence type="fractalNoise" baseFrequency="0.82" numOctaves="2" stitchTiles="stitch" />
          </filter>
          <rect width="100%" height="100%" filter="url(#frostNoise)" />
        </svg>
      </div>

      <div class="screen-body">
        <!-- TAB 1: Home -->
        <div id="tab-home" class="screen-body">
          <div class="scroll-area">
            <div class="home-header">
              <div class="meta-top-row">
                <div id="homeMeta" class="meta-line">天気情報を同期中…</div>
                <div class="meta-tools">
                  <button id="syncBtn" onclick="syncFromServer(true)" class="icon-pill-btn" aria-label="再同期"></button>
                  <button id="settingsBtn" onclick="openSettingsModal()" class="icon-pill-btn" aria-label="設定"></button>
                </div>
              </div>
              <div id="homeBoundary" class="boundary-hero"></div>
              <div id="homeSubLine" class="sub-context-line hidden"></div>
            </div>

            <div id="briefingSlot"></div>
            <div id="homeCenterArea" style="flex:1;display:flex;flex-direction:column;"></div>
          </div>
        </div>

        <!-- TAB 2: Chat -->
        <div id="tab-talk" class="screen-body hidden">
          <div id="talkScroll" class="scroll-area">
            <div id="chatList" class="chat-list"></div>
          </div>
        </div>

        <!-- TAB 3: Lists -->
        <div id="tab-lists" class="screen-body hidden">
          <div class="lists-header">
            <div class="seg-bar">
              <button id="seg-tasks" onclick="switchListSubTab('tasks')" class="seg-btn active">Tasks</button>
              <button id="seg-shopping" onclick="switchListSubTab('shopping')" class="seg-btn">Shopping</button>
              <button id="seg-stock" onclick="switchListSubTab('stock')" class="seg-btn">Stock</button>
              <button id="seg-habits" onclick="switchListSubTab('habits')" class="seg-btn">Habits</button>
            </div>
            <div id="tasksCategoryRow" class="cat-row"></div>
          </div>
          <div class="scroll-area">
            <div id="listsContent" class="list-cards"></div>
          </div>
        </div>
      </div>

      <div class="bottom-fade-veil"></div>

      <div class="bottom-dock">
        <!-- Floating Shared Composer (Chat & Lists) -->
        <div id="sharedComposer" class="shared-composer hidden">
          <div id="chatPhotoPreview" class="attach-preview-bar hidden"></div>
          <div class="composer-row">
            <input id="chatPhotoInput" type="file" accept="image/*" class="hidden" onchange="handleChatPhotoSelect(event)" />
            <button type="button" onclick="document.getElementById('chatPhotoInput').click()" class="attach-circle" aria-label="写真を添付"></button>
            <div id="talkEditor" class="talk-editor" contenteditable="true" role="textbox" aria-multiline="true" data-placeholder="メッセージ・リストをタップして挿入"></div>
            <button type="button" onclick="submitTalkEditor()" class="send-circle" aria-label="送信"></button>
          </div>
        </div>

        <!-- Floating Navigation Dock -->
        <nav class="bottom-nav">
          <button id="nav-home" onclick="switchTab('home')" class="nav-btn active"></button>
          <button id="nav-talk" onclick="switchTab('talk')" class="nav-btn"></button>
          <button id="nav-lists" onclick="switchTab('lists')" class="nav-btn"></button>
        </nav>
      </div>
    </div>
  </div>

  <!-- Settings Modal -->
  <div id="settingsModal" class="modal-backdrop hidden" onclick="if(event.target===this && state.authorized) closeSettingsModal()">
    <div class="modal-sheet">
      <div class="modal-header">
        <span>接続・表示設定</span>
        <button id="closeSettingsBtn" onclick="closeSettingsModal()" class="icon-pill-btn" aria-label="閉じる"></button>
      </div>
      <div id="settingsError" class="modal-error hidden"></div>
      <div id="apiUrlFieldGroup" class="field-group">
        <label class="field-label" for="inputApiUrl">GAS ウェブアプリ URL</label>
        <input id="inputApiUrl" type="url" class="custom-input" placeholder="https://script.google.com/macros/s/.../exec" />
      </div>
      <div class="field-group">
        <label class="field-label" for="inputAuthKey">オーナー認証キー</label>
        <input id="inputAuthKey" type="password" class="custom-input" placeholder="key を入力" />
      </div>
      <button type="button" onclick="toggleTheme()" class="settings-row-btn">
        <span>外観テーマ</span>
        <span id="themeStateLabel">ライト</span>
      </button>
      <div class="custom-btns">
        <button type="button" onclick="saveSettings()" class="btn-solid" style="width:100%;padding:11px;">保存して同期</button>
      </div>
      <div id="settingsDiagnostics" style="margin-top:14px;padding-top:12px;border-top:1px solid var(--border-subtle, rgba(128,128,128,0.2));">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;">
          <span class="field-label" style="margin:0;">診断・エラーログ (<span id="errorLogCount">0</span>件)</span>
          <button type="button" onclick="clearDiagnosticLogs()" style="background:none;border:none;color:var(--text-muted);font-size:12px;cursor:pointer;padding:2px 6px;">クリア</button>
        </div>
        <pre id="settingsErrorLogPreview" style="max-height:110px;overflow:auto;font-size:11px;line-height:1.4;padding:8px;border-radius:8px;background:rgba(0,0,0,0.06);color:var(--text-muted);white-space:pre-wrap;word-break:break-all;margin:0 0 8px 0;">エラーログはありません</pre>
        <div style="display:flex;gap:8px;">
          <button type="button" onclick="copyDiagnosticLogs()" class="settings-row-btn" style="flex:1;justify-content:center;padding:8px 10px;font-size:12px;">診断ログをコピー</button>
          <button type="button" id="discardOutboxBtn" onclick="confirmDiscardOutbox()" class="settings-row-btn hidden" style="flex:1;justify-content:center;padding:8px 10px;font-size:12px;color:#ef4444;">未同期を破棄</button>
        </div>
        <div style="margin-top:8px;">
          <button type="button" id="importSheetsBtn" onclick="runImportFromSheets()" class="settings-row-btn" style="width:100%;justify-content:center;padding:8px 10px;font-size:12px;">シートからD1へ取り込む</button>
        </div>
      </div>
      <div id="appBuildVersion" style="margin-top:10px;text-align:center;font-size:11px;color:var(--text-muted);opacity:0.75;">Version: dc-pwa-v49</div>
    </div>
  </div>

  <!-- Image Lightbox -->
  <div id="imageLightbox" class="modal-backdrop hidden" onclick="closeImageLightbox()">
    <img id="lightboxImg" src="" alt="拡大画像" class="lightbox-img" />
  </div>

  <div id="toastBar" class="toast hidden"></div>

  <script>
    var INITIAL_TAB = "home";
    var SERVER_PRE_KEY = "";
    /**
     * state-api.js - Frontend boot state, offline snapshot & GAS/HTTP API bridge
     */

    var CUSTOM_DUR_STEPS = [5, 10, 15, 30, 45, 60, 90, 120, 150, 180, 240, 360];

    var FEELING_CHIPS = ['✨ すっきり', '😌 ほっとした', '👍 まあまあ', '😮‍💨 つかれた'];

    var TASK_CATS = ['ALL', '仕事', '制作・創作', '家事・環境', '実務・手続', '趣味・文化', '身体・ケア', 'お出かけ'];

    function normalizeTabName(raw) {
      var s = String(raw || '').toLowerCase();
      if (s === 'chat' || s === 'talk') return 'talk';
      if (s === 'lists' || s === 'tasks' || s === 'shopping' || s === 'input' || s === 'stock' || s === 'habits' || s === 'memory') return 'lists';
      return 'home';
    }

    function readUrlParams() {
      var res = {};
      try {
        var sp = new URLSearchParams(window.location.search);
        sp.forEach(function(v, k) { if (v) res[k] = v; });
      } catch (e) {}
      return res;
    }

    var urlParams = readUrlParams();

    var savedTheme = '';
    try { savedTheme = localStorage.getItem('companion_theme') || ''; } catch (e) {}

    var osDark = Boolean(window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);

    var state = {
      isDark: savedTheme ? savedTheme === 'dark' : osDark,
      authKey: (urlParams.key || SERVER_PRE_KEY || localStorage.getItem('companion_auth_key') || '').trim(),
      apiUrl: (urlParams.api || localStorage.getItem('companion_api_url') || '').trim(),
      authorized: false,
      isSyncing: false,
      isSending: false,
      sendingStatusText: '',
      isSubmittingReflect: false,
      tab: normalizeTabName(urlParams.tab || INITIAL_TAB),
      listSubTab: 'tasks',
      taskCategoryFilter: 'ALL',
      expandedListMemo: null,
      weatherLine: '天気情報を同期中…',
      boundary: null,
      deltaText: '',
      fastState: {
        dayKey: '',
        activeSession: null,
        pausedSession: null,
        completedToday: {},
        dismissedToday: {},
        isLowMode: false,
        triagedToday: false,
        dailyBriefing: null,
        aiDeck: { cards: [], lowCards: [] }
      },
      composedDeck: { cards: [], lowCards: [] },
      reflection: null,
      showCustomForm: false,
      customDurMins: 30,
      deckOffset: 0,
      openSwipeId: null,
      lists: { tasks: [], shopping: [], stock: [], habits: [] },
      messages: [],
      pendingChatPhoto: null,
      failedPayloads: {},
      savedRange: null,
      lastFetchedAt: 0,
      syncEpoch: 0,
      inFlightMutations: 0,
      pendingOutbox: [],
      isFlushingOutbox: false,
      outboxLastError: '',
      errorLogs: [],
      toastTimer: null
    };

    function isGasEnvironment() {
      return typeof google !== 'undefined' && google.script && google.script.run;
    }

    function isWorkersApiUrl() {
      var u = String(state.apiUrl || '').trim();
      return Boolean(u) && u.indexOf('script.google.com') === -1;
    }

    function sendChatStream(payload, handlers) {
      var h = handlers || {};
      if (!isWorkersApiUrl()) {
        var urlErr = new Error('Workers API URLが設定されていません');
        if (typeof h.onError === 'function') h.onError(urlErr);
        return Promise.reject(urlErr);
      }

      var baseUrl = String(state.apiUrl || '').trim().replace(/\/+$/, '');
      var doneCalled = false;
      var errorCalled = false;

      function emitError(err) {
        if (errorCalled) return;
        errorCalled = true;
        recordClientError('api:chat/stream', err);
        if (typeof h.onError === 'function') h.onError(err);
      }

      function processSseBlock(block) {
        if (!block) return;
        var lines = block.split('\n');
        var eventName = '';
        var dataLines = [];
        for (var i = 0; i < lines.length; i++) {
          var line = lines[i];
          if (!line || line.charAt(0) === ':') continue;
          if (line.indexOf('event:') === 0) {
            eventName = line.slice(6).trim();
          } else if (line.indexOf('data:') === 0) {
            dataLines.push(line.slice(5).replace(/^ /, ''));
          }
        }
        var dataStr = dataLines.join('\n').trim();
        if (!dataStr) return;

        var parsed = dataStr;
        try {
          parsed = JSON.parse(dataStr);
        } catch (e) {}

        if (eventName === 'status') {
          if (typeof h.onStatus === 'function') h.onStatus(parsed);
        } else if (eventName === 'delta') {
          if (typeof h.onDelta === 'function') h.onDelta(parsed);
        } else if (eventName === 'done') {
          doneCalled = true;
          if (typeof h.onDone === 'function') h.onDone(parsed);
        } else if (eventName === 'error') {
          var msg = (parsed && typeof parsed === 'object' && parsed.error)
            ? String(parsed.error)
            : (typeof parsed === 'string' ? parsed : 'ストリーミングエラー');
          emitError(new Error(msg));
        }
      }

      return fetch(baseUrl + '/chat/stream', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ authKey: state.authKey, payload: payload })
      })
        .then(function(r) {
          if (!r.ok) {
            return r.text().then(function(txt) {
              var errMsg = 'HTTPエラー: ' + r.status;
              try {
                var j = JSON.parse(txt);
                if (j && j.error) errMsg = j.error;
              } catch (e) {}
              throw new Error(errMsg);
            });
          }
          if (!r.body || typeof r.body.getReader !== 'function') {
            throw new Error('ReadableStream がサポートされていません');
          }
          var reader = r.body.getReader();
          var decoder = new TextDecoder('utf-8');
          var buffer = '';

          function pump() {
            return reader.read().then(function(result) {
              if (result.done) {
                buffer += decoder.decode();
                buffer = buffer.replace(/\r\n/g, '\n');
                if (buffer.trim()) {
                  processSseBlock(buffer);
                }
                if (!doneCalled && !errorCalled) {
                  emitError(new Error('ストリームが途中で終了しました'));
                }
                return;
              }
              buffer += decoder.decode(result.value, { stream: true });
              buffer = buffer.replace(/\r\n/g, '\n');

    function coalesceOutbox_() {
      var list = Array.isArray(state.pendingOutbox) ? state.pendingOutbox.slice() : [];

      for (var i = 0; i < list.length; i++) {

        if (isStart && !isSleepStart) {

            if (nxt && (nxt.funcName === 'apiStartAction' || nxt.funcName === 'apiCompleteAction')) {

          if (hasLaterSameOrComplete) {

        compacted.push(cur);

        ? Object.assign({}, payload, { clientOpId: clientOpId })

      state.pendingOutbox.push({

    function flushOutbox() {

      function buildNextChunk() {
        var chunk = [];
        var approxBytes = 0;
        for (var i = 0; i < state.pendingOutbox.length; i++) {
          var item = state.pendingOutbox[i];
          var itemSize = JSON.stringify(item).length;
          if (chunk.length > 0 && approxBytes + itemSize > 1500000) break;
          chunk.push(item);
          approxBytes += itemSize;
        }
        return chunk;

        coalesceOutbox_();
        if (!state.pendingOutbox || state.pendingOutbox.length === 0) {
          state.isFlushingOutbox = false;

        }
        var chunk = buildNextChunk();
        return runMutationApi('apiFlushOutboxBatch', state.authKey, chunk)
          .then(function(res) {
            if (!res || !res.authorized) {
              throw new Error((res && res.error) ? res.error : '同期に失敗しました');
            }
            var results = Array.isArray(res.results) ? res.results : [];
            var okIds = {};
            var firstErr = '';
            results.forEach(function(r) {
              if (r && r.ok) {
                okIds[r.id] = true;
              } else if (r && r.error && !firstErr) {
                firstErr = r.error;
              }
            });
            if (results.length === 0 && !firstErr) {
              firstErr = '同期結果が空です';
            }
            state.pendingOutbox = (state.pendingOutbox || []).filter(function(it) {
              return !okIds[it.id];
            });
            saveOutbox();

            if (Array.isArray(res.addedChatMessages) && res.addedChatMessages.length > 0) {
              res.addedChatMessages.forEach(function(msg) {
                state.messages.push(msg);
              });
            }

            if (firstErr) {
              state.outboxLastError = firstErr;
              recordClientError('outbox_batch', firstErr, { remaining: state.pendingOutbox.length });
              showToast('同期エラー: ' + firstErr);
              state.isFlushingOutbox = false;
              if (typeof renderHome === 'function') renderHome();
              return false;
            }

            if (state.pendingOutbox.length === 0) {
              state.outboxLastError = '';
              if (!res._stale) {

              }
              saveLocalSnapshot();
              renderAll();
              state.isFlushingOutbox = false;
              return true;
            }

            return processBatch();
          })

      var clientRev = (!manual && state.fastState && state.fastState.revision) ? Number(state.fastState.revision) : 0;

    function compressImageToJpeg(file) {
      return new Promise(function(resolve, reject) {
        var reader = new FileReader();
        reader.onload = function(e) {
          var img = new Image();
          img.onload = function() {
            var w = img.width;
            var h = img.height;
            var longEdge = Math.max(w, h);
            var shortEdge = Math.max(1, Math.min(w, h));
            var aspect = longEdge / shortEdge;
            if (aspect > 2.2) {
              if (shortEdge > 1120) {
                var ratio = 1120 / shortEdge;
                w = Math.round(w * ratio);
                h = Math.round(h * ratio);
              }
              var pixels = w * h;
              if (pixels > 3200000) {
                var pScale = Math.sqrt(3200000 / pixels);
                w = Math.round(w * pScale);
                h = Math.round(h * pScale);
              }
            } else if (longEdge > 1600) {
              var scale = 1600 / longEdge;
              w = Math.round(w * scale);
              h = Math.round(h * scale);
            }
            w = Math.max(1, w);
            h = Math.max(1, h);
            var canvas = document.createElement('canvas');
            canvas.width = w;
            canvas.height = h;
            var ctx = canvas.getContext('2d');
            ctx.fillStyle = '#FFFFFF';
            ctx.fillRect(0, 0, w, h);
            ctx.drawImage(img, 0, 0, w, h);
            var dataUrl = canvas.toDataURL('image/jpeg', 0.84);
            resolve({ dataUrl: dataUrl, base64: dataUrl.split(',')[1] || '', mimeType: 'image/jpeg' });
          };
          img.onerror = reject;
          img.src = e.target.result;
        };
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

    function startMistCanvas() {
      var canvas = document.getElementById('ambientCanvas');
      if (!canvas || !canvas.getContext) return;
      var ctx = canvas.getContext('2d');
      var W = 220;
      var H = 428;
      canvas.width = W;
      canvas.height = H;
      var simTime = 0;
      var lastTs = null;

      function drawEllipticalMist(cx, cy, baseR, sx, sy, angle, rgba) {
        ctx.save();
        ctx.translate(cx, cy);
        ctx.rotate(angle);
        ctx.scale(sx, sy);
        var grad = ctx.createRadialGradient(0, 0, 0, 0, 0, baseR);
        var rgb = rgba[0] + ',' + rgba[1] + ',' + rgba[2];
        var a = rgba[3];
        grad.addColorStop(0, 'rgba(' + rgb + ',' + a.toFixed(3) + ')');
        grad.addColorStop(0.48, 'rgba(' + rgb + ',' + (a * 0.55).toFixed(3) + ')');
        grad.addColorStop(1, 'rgba(' + rgb + ',0)');
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.arc(0, 0, baseR, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }

      function drawMist(ts) {
        if (lastTs === null) lastTs = ts;
        var dt = Math.min(0.05, Math.max(0, (ts - lastTs) / 1000));
        lastTs = ts;
        simTime += dt * (state.fastState.activeSession ? 0.55 : 1.0);

        ctx.globalCompositeOperation = 'source-over';
        var bgGrad = ctx.createLinearGradient(0, 0, W * 0.65, H);
        if (state.isDark) {
          bgGrad.addColorStop(0, '#0B0816');
          bgGrad.addColorStop(0.52, '#120A21');
          bgGrad.addColorStop(1, '#160B1E');
        } else {
          bgGrad.addColorStop(0, '#FDFCFF');
          bgGrad.addColorStop(0.52, '#FBF7FF');
          bgGrad.addColorStop(1, '#FEF8FC');
        }
        ctx.fillStyle = bgGrad;
        ctx.fillRect(0, 0, W, H);

        var now = new Date();
        var mins = now.getHours() * 60 + now.getMinutes();
        var mode = 'day';
        if (mins >= 4 * 60 && mins < 10 * 60 + 30) mode = 'morning';
        else if (mins >= 18 * 60 + 30 || mins < 4 * 60) mode = 'night';

        var palette = (state.isDark ? MIST_PALETTES.dark : MIST_PALETTES.light)[mode];
        ctx.globalCompositeOperation = state.isDark ? 'screen' : 'source-over';
        if (typeof document !== 'undefined' && document.hidden) {
          requestAnimationFrame(drawMist);
          return;
        }

        for (var r = 0; r < MIST_RIBBONS.length; r++) {
          var rb = MIST_RIBBONS[r];
          var rCx = (rb.bx + rb.ax * Math.sin(simTime * rb.wx + rb.px)) * W;
          var rCy = (rb.by + rb.ay * Math.cos(simTime * rb.wy + rb.py)) * H;
          var rAngle = rb.rot0 + rb.rotAmp * Math.sin(simTime * rb.rotSpeed + r * 1.4);
          var rColor = palette[(r * 2 + 1) % palette.length];
          drawEllipticalMist(rCx, rCy, rb.rx * W, 1.0 + 0.08 * Math.sin(simTime * 0.4 + r), rb.ry / rb.rx, rAngle, [rColor[0], rColor[1], rColor[2], state.isDark ? 0.25 : 0.16]);
        }

        for (var i = 0; i < MIST_PLUMES.length; i++) {
          var p = MIST_PLUMES[i];
          var dx = (0.65 * Math.sin(simTime * p.wx + p.px) + 0.35 * Math.cos(simTime * p.ux + p.py * 1.3)) * p.ax * W;
          var dy = (0.65 * Math.cos(simTime * p.wy + p.py) + 0.35 * Math.sin(simTime * p.uy + p.px * 0.9)) * p.ay * H;
          var cx = p.bx * W + dx;
          var cy = p.by * H + dy;
          var breath = 1.0 + 0.16 * Math.sin(simTime * p.morphSpeed + p.morphPhase);
          var squash = 1.0 + 0.14 * Math.cos(simTime * (p.morphSpeed * 0.8) + p.morphPhase * 1.2);
          drawEllipticalMist(cx, cy, p.rx * W, Math.max(0.75, breath), Math.max(0.48, (p.ry / p.rx) * squash), p.rot0 + simTime * p.rotSpeed, palette[i % palette.length]);
        }
        requestAnimationFrame(drawMist);
      }
      requestAnimationFrame(drawMist);
    }

    function formatCountdownHMS(remSec) {
      var s = Math.max(0, Math.floor(remSec));
      var h = Math.floor(s / 3600);
      var m = Math.floor((s % 3600) / 60);
      var sec = s % 60;
      return String(h).padStart(2, '0') + ':' + String(m).padStart(2, '0') + ':' + String(sec).padStart(2, '0');
    }

    function formatTimer(sec) {
      var s = Math.max(0, Math.floor(sec));
      var h = Math.floor(s / 3600);
      var m = Math.floor((s % 3600) / 60);
      var sc = s % 60;
      if (h > 0) return String(h) + ':' + String(m).padStart(2, '0') + ':' + String(sc).padStart(2, '0');
      return String(m).padStart(2, '0') + ':' + String(sc).padStart(2, '0');
    }

    function formatCustomDurLabel(mins) {
      var m = Number(mins) || 30;
      if (m < 60) return m + '分';
      var h = Math.floor(m / 60);
      var r = m % 60;
      return r > 0 ? (h + '時間' + r + '分') : (h + '時間');
    }

    function setCustomDurStep(stepIdx) {
      var idx = Math.max(0, Math.min(CUSTOM_DUR_STEPS.length - 1, parseInt(stepIdx, 10) || 0));
      state.customDurMins = CUSTOM_DUR_STEPS[idx];
      var disp = document.getElementById('customDurDisplay');
      if (disp) disp.textContent = formatCustomDurLabel(state.customDurMins);
    }

    function startLiveClocks() {
      setInterval(function() {
        if (state.tab !== 'home') return;
        if (state.boundary && state.boundary.targetMs) {
          var cdEl = document.getElementById('homeCountdown');
          if (cdEl) {
            cdEl.textContent = formatCountdownHMS((state.boundary.targetMs - Date.now()) / 1000);
          }
        }
        var sess = state.fastState.activeSession;
        if (sess && sess.startedAtMs && !state.reflection) {
          var elSec = Math.max(0, Math.floor((Date.now() - sess.startedAtMs - (sess.pausedDurationMs || 0)) / 1000));
          var tEl = document.getElementById('focusTimerText');
          if (tEl) tEl.textContent = formatTimer(elSec);
          var noteEl = document.getElementById('focusGentleNote');
          if (noteEl && Math.floor(elSec / 60) >= 60 && !sess.isWorkBlock && !sess.isSleepCard) {
            noteEl.classList.remove('hidden');
          }
        }
      }, 1000);
    }

    function getActiveTaskIdSet() {
      if (!state.lists || !Array.isArray(state.lists.tasks) || state.lists.tasks.length === 0) {
        return null;
      }
      var set = {};
      state.lists.tasks.forEach(function(t) {
        if (t && t.id) set[t.id] = true;
      });
      return set;
    }

    function findDeckCardById(cardId) {
      if (!cardId || !state.composedDeck) return null;
      var cards = state.composedDeck.cards || [];
      var found = cards.find(function(c) { return c && c.id === cardId; });
      if (found) return found;
      var lowCards = state.composedDeck.lowCards || [];
      return lowCards.find(function(c) { return c && c.id === cardId; }) || null;
    }

    function isDeckCardAvailable(c, completed, dismissed, activeTaskIds) {
      if (!c || !c.id) return false;
      if (!c.isSleepCard && (completed[c.id] || (c.linkedId && completed[c.linkedId]))) return false;
      if (dismissed[c.id]) return false;
      if (activeTaskIds && c.linkedType === 'task' && c.linkedId && !activeTaskIds[c.linkedId]) return false;
      return true;
    }

    function getVisibleDeckCards() {
      var completed = state.fastState.completedToday || {};
      var dismissed = state.fastState.dismissedToday || {};
      var activeTaskIds = getActiveTaskIdSet();
      var pool = state.fastState.isLowMode
        ? (state.composedDeck.lowCards || [])
        : (state.composedDeck.cards || []);
      var valid = pool.filter(function(c) {
        if (state.fastState.pausedSession && c.id === state.fastState.pausedSession.id) return false;
        if (!isDeckCardAvailable(c, completed, dismissed, activeTaskIds)) return false;
        if (c.isTriage && state.fastState.triagedToday) return false;
        return true;
      });
      if (valid.length <= 3) return valid;
      var out = [];
      var start = state.deckOffset % valid.length;
      for (var i = 0; i < 3; i++) {
        out.push(valid[(start + i) % valid.length]);
      }
      return out;
    }

    function renderDurSliderHtml(sliderId, displayId, oninputFn, currentMins) {
      var idx = 0;
      var bestDiff = Infinity;
      for (var i = 0; i < CUSTOM_DUR_STEPS.length; i++) {
        var d = Math.abs(CUSTOM_DUR_STEPS[i] - (currentMins || 30));
        if (d < bestDiff) { bestDiff = d; idx = i; }
      }
      return (
        '<div class="dur-slider-wrap">' +
          '<div class="dur-slider-head">' +
            '<span id="' + displayId + '" class="dur-slider-val">' + formatCustomDurLabel(CUSTOM_DUR_STEPS[idx]) + '</span>' +
          '</div>' +
          '<input id="' + sliderId + '" type="range" class="dur-slider" min="0" max="' + (CUSTOM_DUR_STEPS.length - 1) + '" step="1" value="' + idx + '" oninput="' + oninputFn + '(this.value)" />' +
          '<div class="dur-slider-ticks">' +
            '<span>5分</span>' +
            '<span style="left:27.3%;">30分</span>' +
            '<span style="left:45.5%;">1時間</span>' +
            '<span style="left:63.6%;">2時間</span>' +
            '<span>6時間</span>' +
          '</div>' +
        '</div>'
      );
    }

    function renderHome() {

      var subEl = document.getElementById('homeSubLine');

      if (pendingCount > 0 && !sess && !state.reflection) {

          subEl.textContent = '未同期 ' + pendingCount + '件（エラー: ' + state.outboxLastError + ' / タップで再送・設定）';

        } else {
          subEl.textContent = '未同期の記録が' + pendingCount + '件あります（タップで今すぐ同期）';
          subEl.onclick = function() { syncFromServer(true); };
        }
        subEl.style.cursor = 'pointer';
        subEl.classList.remove('hidden');
      } else if (state.deltaText && !sess && !state.reflection) {
        subEl.textContent = state.deltaText;

        subEl.style.cursor = '';

          '</div>';

        bSlot.innerHTML = '';

      var center = document.getElementById('homeCenterArea');

          var cls = r.feeling === ch ? 'feeling-chip selected' : 'feeling-chip';

          : '';
        var startMs = r.startedMs || (r.card && r.card.startedAtMs) || (Date.now() - (r.usedMins || 1) * 60000);
        var endMs = r.endedMs || Date.now();
        r.startedMs = startMs;
        r.endedMs = endMs;
        var sVal = formatTimeInputHm_(startMs);
        var eVal = formatTimeInputHm_(endMs);
        var reflectAdjustHtml = !r.isAdjustOpen
          ? '<div class="time-adjust-wrap"><button type="button" class="time-adjust-toggle" onclick="toggleReflectTimeAdjust(true)">✎ 時間を調整（' + sVal + ' 〜 ' + eVal + '）</button></div>'
          : '<div class="time-adjust-wrap"><div class="glass-surface time-adjust-panel fade-in">' +
              '<div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:center;">' +
